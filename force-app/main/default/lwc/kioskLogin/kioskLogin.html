<template>
    <div class="login-backdrop">
        <div class="login-card" role="dialog" aria-labelledby="login-title">

            <!-- Worker identity -->
            <div class="worker-identity">
                <div class="worker-avatar">
                    <template lwc:if={workerPhotoUrl}>
                        <img src={workerPhotoUrl} alt={workerDisplayName} class="avatar-img"/>
                    </template>
                    <template lwc:else>
                        <span class="avatar-initials">{workerInitials}</span>
                    </template>
                </div>
                <div class="worker-info">
                    <h2 id="login-title" class="worker-name">{workerDisplayName}</h2>
                    <template lwc:if={workerRoleLabel}>
                        <p class="worker-role">{workerRoleLabel}</p>
                    </template>
                    <p class="login-instruction">{instructionText}</p>
                </div>
            </div>

            <template lwc:if={infoMessage}>
                <div class="lockout-banner" role="status"><span>✓</span><span>{infoMessage}</span></div>
            </template>
            <!-- Error message -->
            <template lwc:if={showError}>
                <div class={errorClass} role="alert">
                    <span class="error-icon-sm">⚠</span>
                    {errorMessage}
                </div>
            </template>

            <!-- Lockout countdown -->
            <template lwc:if={isLocked}>
                <div class="lockout-banner" role="alert">
                    <span>🔒</span>
                    <span>Account locked — try again in <strong>{lockoutCountdown}</strong></span>
                </div>
            </template>

            <template lwc:if={isPadMode}>
            <!-- PIN dots -->
            <div class="pin-dots" aria-label="PIN entry progress">
                <template for:each={pinDots} for:item="dot">
                    <div key={dot.index} class={dot.dotClass}></div>
                </template>
            </div>

            <!-- PIN pad -->
            <div class="pin-pad" role="group" aria-label="PIN pad">
                <template for:each={padKeys} for:item="key">
                    <button
                        key={key.label}
                        class={key.btnClass}
                        data-value={key.value}
                        onclick={handlePadKey}
                        disabled={isPadDisabled}
                        aria-label={key.ariaLabel}
                    >
                        <span class="key-digit">{key.label}</span>
                        <span class="key-sub">{key.sub}</span>
                    </button>
                </template>
            </div>

            </template>

            <template lwc:if={showForgot}>
                <button class="btn-ghost cancel-btn" onclick={handleForgot}>
                    Forgot PIN?
                </button>
            </template>

            <template lwc:if={isModeRequest}>
                <p class="login-instruction">{requestText}</p>
                <button class="btn-primary" onclick={handleSendCode} disabled={isSubmitting}>
                    Email me a code
                </button>
                <button class="btn-ghost cancel-btn" onclick={handleResetBack}>Back</button>
            </template>

            <template lwc:if={isModeCode}>
                <p class="login-instruction">Code sent to {maskedEmail}. Enter the 6 digits.</p>
                <input
                    type="tel"
                    inputmode="numeric"
                    maxlength="6"
                    class="code-input"
                    value={code}
                    oninput={handleCodeInput}
                    onkeydown={handleInputKeydown}
                    aria-label="6-digit code"
                />
                <button class="btn-primary" onclick={handleCodeNext} disabled={codeSubmitDisabled}>
                    Next
                </button>
                <button class="btn-ghost cancel-btn" onclick={handleResetBack}>Back</button>
            </template>

            <!-- Cancel -->
            <button class="btn-ghost cancel-btn" onclick={handleCancel}>
                ← Different worker
            </button>
        </div>
    </div>
</template>
