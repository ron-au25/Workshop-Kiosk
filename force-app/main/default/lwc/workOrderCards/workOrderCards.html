<template>
  <div class="wo-wrapper">
    <div class="wo-header">
      <h2 class="wo-title">Work Orders</h2>
      <span class="wo-count">{totalLabel}</span>
    </div>

    <div class="filter-bar">
      <div class="filter-group filter-select">
        <label class="filter-label" for="status-select">Status</label>
        <select
          id="status-select"
          class="form-select"
          onchange={handleStatusChange}
          onkeydown={handleInputKeydown}
        >
          <template for:each={statusOptions} for:item="opt">
            <option key={opt.value} value={opt.value} selected={opt.selected}>
              {opt.label}
            </option>
          </template>
        </select>
      </div>
      <div class="filter-group filter-select">
        <label class="filter-label" for="priority-select">Priority</label>
        <select
          id="priority-select"
          class="form-select"
          onchange={handlePriorityChange}
          onkeydown={handleInputKeydown}
        >
          <template for:each={priorityOptions} for:item="opt">
            <option key={opt.value} value={opt.value} selected={opt.selected}>
              {opt.label}
            </option>
          </template>
        </select>
      </div>
      <div class="filter-group filter-sort">
        <label class="filter-label" for="sort-select">Sort</label>
        <div class="sort-row">
          <select
            id="sort-select"
            class="form-select"
            onchange={handleSortFieldChange}
            onkeydown={handleInputKeydown}
          >
            <template for:each={sortFieldOptions} for:item="opt">
              <option key={opt.value} value={opt.value} selected={opt.selected}>
                {opt.label}
              </option>
            </template>
          </select>
          <button
            class="icon-btn"
            onclick={handleSortDirToggle}
            title={sortDirLabel}
            aria-label={sortDirLabel}
          >
            {sortDirIcon}
          </button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Scope</span>
        <label class="switch">
          <input
            type="checkbox"
            class="switch-input"
            checked={territoryWide}
            onchange={handleTerritoryToggle}
            onkeydown={handleInputKeydown}
          />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-text">Territory</span>
        </label>
      </div>
      <div class="filter-group">
        <span class="filter-label">From</span>
        <div class="date-nav">
          <button
            class="icon-btn"
            onclick={handlePrevDay}
            title="Previous day"
            aria-label="Previous day"
          >
            ‹
          </button>
          <input
            type="date"
            class="date-input"
            value={dateFrom}
            onchange={handleDateFrom}
            onkeydown={handleInputKeydown}
            aria-label="From date"
          />
          <button
            class="icon-btn"
            onclick={handleNextDay}
            title="Next day"
            aria-label="Next day"
          >
            ›
          </button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">To</span>
        <input
          type="date"
          class="date-input"
          value={dateTo}
          onchange={handleDateTo}
          onkeydown={handleInputKeydown}
          aria-label="To date"
        />
      </div>
      <div class="filter-group filter-search">
        <div class="search-row">
          <div class="search-wrap">
            <span class="search-icon-sm">⊞</span>
            <input
              type="search"
              class="wagon-search"
              placeholder="Wagon or asset"
              value={wagonSearch}
              oninput={handleWagonSearch}
              onkeydown={handleInputKeydown}
              aria-label="Search by wagon number or asset name"
            />
          </div>
          <button
            class="search-btn"
            onclick={handleSearchAll}
            title="Search all workpack work orders org-wide by wagon (at least 3 characters)"
          >
            Search
          </button>
        </div>
      </div>
    </div>

    <template lwc:if={isTruncated}>
      <div class="truncated-note" role="status">⚠ {truncatedMessage}</div>
    </template>

    <template lwc:if={isLoading}>
      <div class="wo-loading">
        <div class="spinner"></div>
        <p>Loading work orders…</p>
      </div>
    </template>

    <template lwc:elseif={hasError}>
      <div class="wo-error">
        <span>⚠</span>
        <p>{errorMessage}</p>
        <button class="btn-secondary" onclick={fetchForDateRange}>Retry</button>
      </div>
    </template>

    <template lwc:elseif={isEmpty}>
      <div class="wo-empty">
        <span class="empty-icon">🔧</span>
        <p>{emptyMessage}</p>
        <button class="btn-secondary" onclick={clearFilters}>
          Reset Filters
        </button>
      </div>
    </template>

    <template lwc:else>
      <c-work-order-card-list
        records={workOrders}
        onopendetail={handleOpenDetail}
      ></c-work-order-card-list>
    </template>
  </div>
</template>
