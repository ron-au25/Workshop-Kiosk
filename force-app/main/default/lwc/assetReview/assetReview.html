<template>
  <div class="ar-wrapper">
    <!-- Top bar -->
    <div class="ar-topbar">
      <button
        class="ar-back-btn"
        onclick={handleBack}
        aria-label="Back to work pack"
      >
        ‹ Back to Workpack
      </button>
      <template lwc:if={wagon}>
        <div class="ar-topbar-info">
          <span class="ar-wagon-name">{wagon.name}</span>
          <template lwc:if={wagonStatusPill}>
            <span class="ar-status-pill">{wagonStatusPill}</span>
          </template>
          <template lwc:if={wagon.floc}>
            <span class="ar-chip">FLOC {wagon.floc}</span>
          </template>
        </div>
      </template>
    </div>

    <!-- Loading -->
    <template lwc:if={isLoading}>
      <div class="ar-center">
        <div class="spinner"></div>
        <p>Loading wagon asset…</p>
      </div>
    </template>

    <!-- Error -->
    <template lwc:elseif={hasError}>
      <div class="ar-center">
        <span class="ar-error-icon">⚠</span>
        <p>Failed to load the wagon asset. This work pack may have no asset.</p>
        <button class="btn-secondary" onclick={loadWagon}>Retry</button>
      </div>
    </template>

    <!-- Main -->
    <template lwc:else>
      <div class="ar-body">
        <!-- ─── Wagon diagram with wheelset zones ─── -->
        <div class="ar-section">
          <button
            class="collapse-header"
            onclick={handleToggleDiagram}
            aria-expanded={diagramExpanded}
          >
            <span class="section-title nomargin"
              >Components — tap a section</span
            >
            <span class="collapse-icon">{diagramToggleIcon}</span>
          </button>

          <div class="ic-toolbar">
            <nav class="ic-crumbs" aria-label="Asset path">
              <template for:each={crumbs} for:item="c">
                <button
                  key={c.key}
                  class="ic-crumb"
                  data-level={c.level}
                  onclick={handleCrumb}
                  disabled={c.last}
                >
                  {c.label}
                </button>
              </template>
            </nav>
            <template lwc:if={canSchematic}>
              <span class="ic-views">
                <template for:each={mapViewButtons} for:item="v">
                  <button
                    key={v.value}
                    class={v.cls}
                    data-view={v.value}
                    onclick={handleMapView}
                  >
                    {v.label}
                  </button>
                </template>
              </span>
            </template>
          </div>

          <!-- Icicle asset map: wagon > component > sub-asset -->
          <template lwc:if={showMap}>
            <div class="ic-map">
              <button class="ic-root" onclick={handleIcicleRoot}>
                {icicleRootLabel}
                <span class="ic-root-hint">Show all</span>
              </button>
              <div class="ic-cols">
                <template for:each={icicleCols} for:item="col">
                  <div key={col.id} class="ic-col" style={col.flexStyle}>
                    <button
                      class={col.cls}
                      data-id={col.id}
                      onclick={handleSelectWheelset}
                      aria-label={col.name}
                    >
                      <span class={col.dotClass}></span>
                      <span class="chip-label">{col.name}</span>
                      <template lwc:if={col.hasWos}>
                        <span class="wo-badge">{col.woCount}</span>
                      </template>
                    </button>
                    <div class="ic-kids">
                      <template for:each={col.kids} for:item="kid">
                        <button
                          key={kid.id}
                          class={kid.cls}
                          data-id={kid.id}
                          onclick={handleSelectChild}
                          aria-label={kid.name}
                        >
                          <span class={kid.dotClass}></span>
                          <span class="chip-label">{kid.name}</span>
                          <template lwc:if={kid.hasWos}>
                            <span class="wo-badge">{kid.woCount}</span>
                          </template>
                        </button>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <template lwc:if={showSchematic}>
            <template lwc:if={hasChildComponents}>
              <div class="child-strip">
                <span class="child-strip-label">Sub-assets</span>
                <template for:each={childComponents} for:item="child">
                  <button
                    key={child.id}
                    class={child.chipClass}
                    data-id={child.id}
                    onclick={handleSelectChild}
                  >
                    <span class={child.dotClass}></span>
                    <span class="chip-label">{child.name}</span>
                  </button>
                </template>
              </div>
            </template>
            <div class="diagram-frame">
              <img
                class="diagram-img"
                src={wagonDiagramUrl}
                alt="Wagon diagram"
              />
              <template for:each={diagramZones} for:item="zone">
                <button
                  key={zone.id}
                  class={zone.zoneClass}
                  style={zone.zoneStyle}
                  data-id={zone.id}
                  onclick={handleSelectWheelset}
                  aria-label={zone.label}
                >
                  <span class={zone.dotClass}></span>
                  <span class="zone-label">{zone.label}</span>
                </button>
              </template>
            </div>
            <div class="diagram-legend">
              <span class="legend-item"
                ><span class="zone-dot status-grey"></span> No activity</span
              >
              <span class="legend-item"
                ><span class="zone-dot status-green"></span> In progress</span
              >
              <span class="legend-item"
                ><span class="zone-dot status-red"></span> Attention /
                Scrap</span
              >
            </div>
          </template>
        </div>

        <!-- ─── Performance graphs ─── -->
        <template lwc:if={hasCharts}>
          <div class="ar-section">
            <button
              class="collapse-header"
              onclick={handleToggleCharts}
              aria-expanded={chartsExpanded}
            >
              <span class="section-title nomargin">Measure Performance</span>
              <span class="collapse-icon">{chartsToggleIcon}</span>
            </button>
            <template lwc:if={chartsExpanded}>
              <div class="charts-grid">
                <template for:each={charts} for:item="chart">
                  <div key={chart.key} class="chart-card">
                    <div class="chart-title">{chart.title}</div>
                    <svg
                      class="chart-svg"
                      viewBox={chart.viewBox}
                      preserveAspectRatio="xMidYMid meet"
                    >
                      <!-- gridlines -->
                      <template for:each={chart.gridlines} for:item="g">
                        <g key={g.key}>
                          <line
                            x1={g.x1}
                            y1={g.y}
                            x2={g.x2}
                            y2={g.y}
                            class="chart-grid"
                          />
                          <text x="8" y={g.labelY} class="chart-axis-text">
                            {g.valText}
                          </text>
                        </g>
                      </template>
                      <!-- series line -->
                      <polyline points={chart.polyline} class="chart-line" />
                      <!-- dots + labels -->
                      <template for:each={chart.dots} for:item="d">
                        <g key={d.key}>
                          <template lwc:if={d.cy}>
                            <circle
                              cx={d.cx}
                              cy={d.cy}
                              r="4"
                              class="chart-dot"
                            />
                            <text
                              x={d.cx}
                              y={d.valueY}
                              class="chart-value-text"
                              text-anchor="middle"
                            >
                              {d.valueText}
                            </text>
                          </template>
                          <text
                            x={d.labelX}
                            y={d.labelY}
                            class="chart-x-text"
                            text-anchor="middle"
                          >
                            {d.label}
                          </text>
                        </g>
                      </template>
                    </svg>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- ─── Work order list + workspace (v6) ─── -->
        <template lwc:if={hasWorkspace}>
          <div class="wl-chipbar">
            <template lwc:if={showWtChips}>
              <div class="wl-chips">
                <template for:each={wtChips} for:item="c">
                  <button
                    key={c.name}
                    class={c.chipClass}
                    data-wt={c.name}
                    onclick={handleToggleWt}
                  >
                    {c.name}<span class="wl-chip-n">{c.open}</span>
                  </button>
                </template>
                <template lwc:if={wtActive}>
                  <button class="wl-chip clear" onclick={handleClearWt}>
                    Show all
                  </button>
                </template>
              </div>
            </template>
          </div>
          <div class="ar-split">
            <aside class={listClass}>
              <template lwc:if={listCollapsed}>
                <div class="wl-rail">
                  <button
                    class="wl-rail-btn"
                    onclick={handleToggleList}
                    title="Expand list"
                  >
                    »
                  </button>
                  <template lwc:if={wpRow}>
                    <button
                      class={wpRow.railClass}
                      data-wo-id={wpRow.id}
                      onclick={handlePickWo}
                      title={wpRow.number}
                    >
                      WP
                    </button>
                  </template>
                  <template for:each={railRows} for:item="r">
                    <button
                      key={r.id}
                      class={r.railClass}
                      data-wo-id={r.id}
                      onclick={handlePickWo}
                      title={r.title}
                    >
                      <span class="wl-dot" style={r.dotStyle}></span>{r.short}
                    </button>
                  </template>
                  <button
                    class="wl-rail-btn raise"
                    onclick={handleOpenRaise}
                    title="Raise Task"
                  >
                    ＋
                  </button>
                </div>
              </template>
              <template lwc:else>
                <div class="wl-head">
                  <span class="wl-title">Work orders</span>
                  <span class="wl-head-actions">
                    <button
                      class={pinClass}
                      onclick={handleTogglePin}
                      title="Keep list open"
                    >
                      📌
                    </button>
                    <button
                      class="wl-rail-btn"
                      onclick={handleToggleList}
                      title="Collapse list"
                    >
                      «
                    </button>
                  </span>
                </div>
                <div class="wl-body">
                  <template lwc:if={wpRow}>
                    <button
                      class={wpRow.rowClass}
                      data-wo-id={wpRow.id}
                      onclick={handlePickWo}
                    >
                      <span class="wl-pin">WP</span>
                      <span class="wl-num">{wpRow.number}</span>
                      <span class="wl-sub">{wpRow.subject}</span>
                    </button>
                  </template>
                  <template for:each={woGroups} for:item="g">
                    <div key={g.key} class="wl-group">
                      <div class="wl-group-name">{g.name}</div>
                      <template for:each={g.rows} for:item="r">
                        <div key={r.id} class="wl-rowwrap">
                          <button
                            class={r.rowClass}
                            data-wo-id={r.id}
                            onclick={handlePickWo}
                          >
                            <span class="wl-dot" style={r.dotStyle}></span>
                            <span class="wl-num">{r.number}</span>
                            <span class="wl-type">{r.workTypeName}</span>
                            <span class="wl-sub">{r.subject}</span>
                          </button>
                          <template lwc:if={r.canEdit}>
                            <button
                              class="icon-btn edit-btn"
                              data-task-id={r.id}
                              onclick={handleEditTask}
                              title="Edit task"
                            >
                              ✏️
                            </button>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template lwc:if={noRows}>
                    <p class="wl-empty">No work orders for this selection.</p>
                  </template>
                </div>
                <button
                  class="btn-add-entry wl-raise"
                  onclick={handleOpenRaise}
                >
                  ＋ Raise Task
                </button>
              </template>
            </aside>

            <section class="ar-work">
              <template lwc:if={hasSelection}>
                <div class="aw-asset">
                  <span class="aw-asset-name">{detailHeading}</span>
                  <template for:each={assetTileFields} for:item="f">
                    <span key={f.key} class="aw-chip"
                      ><b>{f.label}</b> {f.value}</span
                    >
                  </template>
                  <button
                    class="aw-info"
                    onclick={handleToggleDrawer}
                    title="Asset details"
                  >
                    ⓘ
                  </button>
                </div>
                <template lwc:if={drawerOpen}>
                  <div class="aw-drawer">
                    <template lwc:if={hasDrawerRows}>
                      <div class="overview-grid">
                        <template for:each={drawerRows} for:item="r">
                          <div key={r.key} class={r.cls}>
                            <span class="ov-key">{r.label}</span>
                            <template lwc:if={r.isRead}>
                              <span class="ov-val">{r.value}</span>
                            </template>
                            <template lwc:if={r.isText}>
                              <input
                                type="text"
                                class="form-input"
                                data-key={r.key}
                                value={r.value}
                                oninput={handleDrawerInput}
                                onkeydown={handleInputKeydown}
                              />
                            </template>
                            <template lwc:if={r.isDate}>
                              <input
                                type="date"
                                class="form-input"
                                data-key={r.key}
                                value={r.value}
                                onchange={handleDrawerInput}
                                onkeydown={handleInputKeydown}
                              />
                            </template>
                            <template lwc:if={r.isPick}>
                              <select
                                class="form-select"
                                data-key={r.key}
                                onchange={handleDrawerInput}
                                onkeydown={handleInputKeydown}
                              >
                                <template for:each={r.options} for:item="o">
                                  <option
                                    key={o.value}
                                    value={o.value}
                                    selected={o.selected}
                                  >
                                    {o.label}
                                  </option>
                                </template>
                              </select>
                            </template>
                          </div>
                        </template>
                      </div>
                      <template lwc:if={drawerDirty}>
                        <div class="dr-actions">
                          <button
                            class="btn-cancel"
                            onclick={handleDrawerReset}
                          >
                            Reset
                          </button>
                          <button
                            class="btn-save-entry"
                            onclick={handleDrawerSave}
                            disabled={drawerSaveDisabled}
                          >
                            {drawerSaveLabel}
                          </button>
                        </div>
                      </template>
                      <template lwc:if={drawerFeedback}>
                        <p class={drawerFeedbackClass}>{drawerFeedback}</p>
                      </template>
                    </template>
                    <template lwc:else>
                      <p class="mz-side-empty">
                        No drawer fields configured or readable.
                      </p>
                    </template>
                  </div>
                </template>
              </template>

              <template lwc:if={selectedFilterWoId}>
                <div class="aw-wo">
                  <div class="aw-wo-title">
                    <span class="wl-dot" style={selectedDotStyle}></span>
                    <span class="aw-wo-num">{selectedFilterWoNumber}</span>
                    <span class="aw-wo-sub">{selectedSubject}</span>
                    <button
                      class="wo-filter-clear"
                      onclick={handleClearWoFilter}
                    >
                      ✕ All on asset
                    </button>
                  </div>
                  <template lwc:if={hasTile}>
                    <div class="aw-tile">
                      <template for:each={tileFields} for:item="f">
                        <span key={f.key} class="aw-chip"
                          ><b>{f.label}</b> {f.value}</span
                        >
                      </template>
                    </div>
                  </template>
                  <template lwc:if={nextStepText}>
                    <div class="aw-next">Next: {nextStepText}</div>
                  </template>
                </div>
              </template>

              <div class="aw-tabs">
                <template for:each={tabs} for:item="t">
                  <button
                    key={t.key}
                    class={t.cls}
                    data-tab={t.key}
                    onclick={handleTab}
                  >
                    {t.label}
                  </button>
                </template>
              </div>

              <template lwc:if={isMeasureTab}>
                <div class="col-header">
                  <span class="col-title">Measure Points</span>
                  <button class="btn-add-entry" onclick={handleAddMeasure}>
                    + New Measure
                  </button>
                </div>
                <template lwc:if={showMeasureForm}>
                  <div class="entry-form">
                    <div class="form-group">
                      <label class="form-label">Component Name</label>
                      <input
                        type="text"
                        class="form-input large"
                        placeholder="e.g. Rotary Knuckle…"
                        value={editComponentName}
                        oninput={handleComponentNameChange}
                        onkeydown={handleInputKeydown}
                      />
                    </div>

                    <div class="form-group">
                      <label class="form-label">Type</label>
                      <div class="seg-control">
                        <template for:each={measureTypeOptions} for:item="opt">
                          <button
                            key={opt.value}
                            class="seg-btn"
                            data-type={opt.value}
                            data-selected={opt.isSelected}
                            onclick={handleMeasureTypeSelect}
                          >
                            {opt.label}
                          </button>
                        </template>
                      </div>
                    </div>

                    <template lwc:if={showValueFields}>
                      <div class="form-row-2">
                        <div class="form-group">
                          <label class="form-label">Value</label>
                          <input
                            type="number"
                            class="form-input"
                            placeholder="0.0"
                            value={editMeasureValue}
                            oninput={handleMeasureValueChange}
                            onkeydown={handleInputKeydown}
                            step="any"
                          />
                        </div>
                        <div class="form-group">
                          <label class="form-label">Value Type</label>
                          <select
                            class="form-select"
                            onchange={handleMeasureValueTypeChange}
                            onkeydown={handleInputKeydown}
                          >
                            <template for:each={valueTypeOptions} for:item="vt">
                              <option
                                key={vt.value}
                                value={vt.value}
                                selected={vt.isSelected}
                              >
                                {vt.label}
                              </option>
                            </template>
                          </select>
                        </div>
                      </div>
                    </template>

                    <div class="form-group">
                      <label class="form-label">Defect Location</label>
                      <select
                        class="form-select"
                        onchange={handleDefectLocationChange}
                        onkeydown={handleInputKeydown}
                      >
                        <template
                          for:each={defectLocationOptions}
                          for:item="dl"
                        >
                          <option
                            key={dl.value}
                            value={dl.value}
                            selected={dl.isSelected}
                          >
                            {dl.label}
                          </option>
                        </template>
                      </select>
                    </div>

                    <div class="form-group">
                      <label class="form-label">Comments</label>
                      <textarea
                        class="form-textarea"
                        rows="2"
                        data-id="editComments"
                        placeholder="Observations, findings…"
                        value={editComments}
                        oninput={handleCommentsChange}
                        onkeydown={handleInputKeydown}
                      ></textarea>
                    </div>

                    <div class="form-group">
                      <label class="form-label"
                        >Review Notes
                        <span class="optional">(optional)</span></label
                      >
                      <textarea
                        class="form-textarea"
                        rows="2"
                        data-id="editReviewNotes"
                        placeholder="Notes for supervisor review…"
                        value={editReviewNotes}
                        oninput={handleReviewNotesChange}
                        onkeydown={handleInputKeydown}
                      ></textarea>
                    </div>

                    <div class="form-group">
                      <label class="form-label"
                        >Photo <span class="optional">(optional)</span></label
                      >
                      <template lwc:if={pendingImagePreview}>
                        <div class="img-preview">
                          <img src={pendingImagePreview} alt="Selected" />
                          <button
                            type="button"
                            class="img-remove"
                            onclick={handleRemovePendingImage}
                            title="Remove photo"
                          >
                            ✕
                          </button>
                        </div>
                      </template>
                      <template lwc:else>
                        <label class="img-upload-btn">
                          <span>📷 Take photo / attach image</span>
                          <input
                            type="file"
                            accept="image/*"
                            capture="environment"
                            data-id="measureImageInput"
                            onchange={handleImageSelect}
                            onkeydown={handleInputKeydown}
                          />
                        </label>
                      </template>
                    </div>

                    <template lwc:if={measureFeedback}>
                      <p class={measureFeedbackClass}>{measureFeedback}</p>
                    </template>

                    <div class="form-actions">
                      <button class="btn-cancel" onclick={handleMeasureCancel}>
                        Cancel
                      </button>
                      <button
                        class="btn-save-entry"
                        onclick={handleMeasureSave}
                        disabled={isSavingMeasure}
                      >
                        {measureSaveLabel}
                      </button>
                    </div>
                  </div>
                </template>
                <div class="mz-side-bar">
                  <span class="mz-side-lbl">Side panel</span>
                  <template for:each={sideModes} for:item="m">
                    <button
                      key={m.value}
                      class={m.cls}
                      data-mode={m.value}
                      onclick={handleSideMode}
                    >
                      {m.label}
                    </button>
                  </template>
                </div>
                <div class={measureWrapClass}>
                  <div class="points-list">
                    <template lwc:if={hasPoints}>
                      <template for:each={pointGroups} for:item="g">
                        <div key={g.key} class="mz-group">
                          <div class="mz-group-h">{g.label}</div>
                          <template for:each={g.points} for:item="pt">
                            <div key={pt.id} class={pt.rowCls}>
                              <div class="point-card-header">
                                <span class="point-component"
                                  >{pt.componentName}</span
                                >
                                <div class="point-actions">
                                  <template lwc:if={pt.hasDoc}>
                                    <button
                                      class="mz-doc-chip"
                                      data-point-id={pt.id}
                                      onclick={handleDocChip}
                                      title="Show in document"
                                    >
                                      {pt.docLabel}
                                    </button>
                                  </template>
                                  <button
                                    class="icon-btn edit-btn"
                                    data-point-id={pt.id}
                                    onclick={handleEditMeasure}
                                    title="Edit"
                                  >
                                    ✏️
                                  </button>
                                </div>
                              </div>
                              <div class="mz-outcomes">
                                <button
                                  class={pt.okCls}
                                  data-point-id={pt.id}
                                  data-outcome="OK"
                                  onclick={handleOutcome}
                                >
                                  OK
                                </button>
                                <button
                                  class={pt.attCls}
                                  data-point-id={pt.id}
                                  data-outcome="Attention Required"
                                  onclick={handleOutcome}
                                >
                                  Attention
                                </button>
                                <button
                                  class={pt.scrapCls}
                                  data-point-id={pt.id}
                                  data-outcome="Scrap"
                                  onclick={handleOutcome}
                                >
                                  Scrap
                                </button>
                                <template lwc:if={pt.isNumeric}>
                                  <input
                                    type="number"
                                    step="any"
                                    class="mz-val"
                                    data-point-id={pt.id}
                                    value={pt.measureValue}
                                    onchange={handleInlineValue}
                                    onkeydown={handleInputKeydown}
                                    placeholder="value"
                                  />
                                  <span class="measure-unit"
                                    >{pt.measureValueType}</span
                                  >
                                </template>
                              </div>
                              <div
                                class="point-meta-line"
                                data-point-id={pt.id}
                                onclick={handleSelectPoint}
                              >
                                <template lwc:if={pt.workOrderNumber}>
                                  <span
                                    class="point-wo"
                                    title="Related work order"
                                    >🔧 WO {pt.workOrderNumber}</span
                                  >
                                </template>
                                <span class="point-date"
                                  >{pt.formattedDate}</span
                                >
                                <template lwc:if={pt.showDefect}>
                                  <span class="point-defect"
                                    >📍 {pt.defectLocation}</span
                                  >
                                </template>
                              </div>
                              <template lwc:if={pt.hasImage}>
                                <div class="point-image">
                                  <img
                                    src={pt.imageUri}
                                    alt={pt.componentName}
                                    loading="lazy"
                                  />
                                </div>
                              </template>
                              <template lwc:if={pt.comments}>
                                <p class="point-comments">{pt.comments}</p>
                              </template>
                            </div>
                          </template>
                        </div>
                      </template>
                    </template>
                    <template lwc:else>
                      <template lwc:if={showMeasureForm}></template>
                      <template lwc:else>
                        <div class="ar-empty">
                          <span class="ar-empty-icon">🔍</span>
                          <p>
                            No measure points yet.<br />Tap "+ New Measure".
                          </p>
                        </div>
                      </template>
                    </template>
                  </div>
                  <template lwc:if={isSideDoc}>
                    <div class="mz-side">
                      <div class="mz-side-title">{sidePointLabel}</div>
                      <template lwc:if={sidePointHasDoc}>
                        <c-kiosk-pdf-pane
                          session-token={sessionToken}
                          workpack-id={workOrderId}
                        ></c-kiosk-pdf-pane>
                      </template>
                      <template lwc:else>
                        <p class="mz-side-empty">
                          No source document for this measure. Tap a 📄 chip.
                        </p>
                      </template>
                    </div>
                  </template>
                  <template lwc:if={isSideTrend}>
                    <div class="mz-side">
                      <div class="mz-side-title">{sidePointLabel}</div>
                      <template lwc:if={hasTrend}>
                        <template for:each={trendRows} for:item="tr">
                          <div key={tr.id} class="mz-trend-row">
                            <span>WO {tr.woNumber}</span>
                            <span>{tr.date}</span>
                            <span>{tr.outcome}</span>
                            <span class="mz-trend-val">{tr.value}</span>
                          </div>
                        </template>
                      </template>
                      <template lwc:else>
                        <p class="mz-side-empty">
                          No history for this component.
                        </p>
                      </template>
                    </div>
                  </template>
                </div>
              </template>

              <template lwc:if={isExecuteTab}>
                <template lwc:if={planActionError}>
                  <p class="ar-plan-error">{planActionError}</p>
                </template>
                <template lwc:if={hasPlans}>
                  <template lwc:if={planActionError}>
                    <p class="ar-plan-error">{planActionError}</p>
                  </template>
                  <div class="plan-list">
                    <template for:each={workPlansEnriched} for:item="plan">
                      <div key={plan.id} class="plan-card">
                        <button
                          class={plan.toggleClass}
                          data-plan-id={plan.id}
                          onclick={handleTogglePlan}
                          aria-expanded={plan.isExpanded}
                        >
                          <span class="plan-order">{plan.executionOrder}</span>
                          <span class="plan-name">{plan.name}</span>
                          <template lwc:if={plan.workOrderNumber}>
                            <span class="plan-wo" title="Related work order"
                              >WO {plan.workOrderNumber}</span
                            >
                          </template>
                          <span class="ar-plan-ring">
                            <svg viewBox="0 0 44 44" class="ar-ring-svg">
                              <circle
                                class="ar-ring-track"
                                cx="22"
                                cy="22"
                                r="18"
                              ></circle>
                              <circle
                                class="ar-ring-arc"
                                cx="22"
                                cy="22"
                                r="18"
                                stroke-dasharray={plan.ringDash}
                                stroke-dashoffset={plan.ringOffset}
                                transform="rotate(-90 22 22)"
                              ></circle>
                              <text
                                class="ar-ring-pct"
                                x="22"
                                y="22"
                                text-anchor="middle"
                                dominant-baseline="central"
                              >
                                {plan.ringPercentText}
                              </text>
                            </svg>
                          </span>
                          <span class="plan-chevron">{plan.chevron}</span>
                        </button>
                        <template lwc:if={plan.isExpanded}>
                          <div class="step-list">
                            <template for:each={plan.steps} for:item="step">
                              <div key={step.id} class={step.stepClass}>
                                <span class="step-num"
                                  >{step.executionOrder}</span
                                >
                                <div class="step-body">
                                  <span class="step-name">{step.name}</span>
                                  <template lwc:if={step.description}>
                                    <span class="step-desc"
                                      >{step.description}</span
                                    >
                                  </template>
                                </div>
                                <span class="step-status">{step.status}</span>
                                <template lwc:if={step.hasAction}>
                                  <button
                                    class="ar-step-action-btn"
                                    data-step-id={step.id}
                                    data-action-def={step.actionDefinition}
                                    onclick={handleStepClick}
                                  >
                                    Open action
                                  </button>
                                </template>
                                <template lwc:if={step.canComplete}>
                                  <button
                                    class="ar-step-complete-btn"
                                    data-step-id={step.id}
                                    onclick={handleMarkStepComplete}
                                  >
                                    Mark complete
                                  </button>
                                </template>
                              </div>
                            </template>
                            <template lwc:if={plan.hasNoSteps}>
                              <p class="no-steps">No steps defined.</p>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <template lwc:else>
                  <div class="ar-empty">
                    <span class="ar-empty-icon">📋</span>
                    <p>No work plans on the work order for this asset.</p>
                  </div>
                </template>
              </template>

              <template lwc:if={isPartsTab}>
                <template lwc:if={partActionError}>
                  <p class="ar-plan-error">{partActionError}</p>
                </template>
                <template lwc:if={hasParts}>
                  <div class="parts-table">
                    <div class="parts-head">
                      <span class="parts-col-name">Part</span>
                      <span class="parts-col-num">Consumed</span>
                      <span class="parts-col-num">Required</span>
                      <span class="parts-col-num">Cost</span>
                      <span class="parts-col-act"></span>
                    </div>
                    <template for:each={partsEnriched} for:item="part">
                      <div key={part.key} class="parts-row">
                        <span class="parts-col-name">{part.productName}</span>
                        <span class="parts-col-num">{part.consumedText}</span>
                        <span class="parts-col-num">{part.requiredText}</span>
                        <span class="parts-col-num">{part.costText}</span>
                        <span class="parts-col-act">
                          <template lwc:if={part.canConsume}>
                            <button
                              class="ar-consume-btn"
                              data-wo-id={part.workOrderId}
                              data-product-id={part.product2Id}
                              data-pbe-id={part.pricebookEntryId}
                              data-unit-price={part.unitPrice}
                              onclick={handleConsumePart}
                            >
                              + Consume
                            </button>
                          </template>
                        </span>
                      </div>
                    </template>
                  </div>
                </template>
                <template lwc:else>
                  <div class="ar-empty">
                    <span class="ar-empty-icon">📦</span>
                    <p>No parts recorded for this asset.</p>
                  </div>
                </template>

                <template lwc:if={canAddPart}>
                  <div class="ar-addpart">
                    <button
                      class="ar-addpart-toggle"
                      onclick={handleToggleAddPart}
                    >
                      + Add part
                    </button>
                    <template lwc:if={showAddPart}>
                      <div class="ar-addpart-row">
                        <select
                          class="form-select"
                          onchange={handleAddProductChange}
                          onkeydown={handleInputKeydown}
                        >
                          <option value="">Select a part…</option>
                          <template for:each={productOptions} for:item="opt">
                            <option key={opt.value} value={opt.value}>
                              {opt.label}
                            </option>
                          </template>
                        </select>
                        <button
                          class="ar-consume-btn"
                          onclick={handleAddPart}
                          disabled={addPartDisabled}
                        >
                          Add
                        </button>
                      </div>
                    </template>
                  </div>
                </template>
              </template>

              <template lwc:if={isNotesTab}>
                <div class="notes-pane">
                  <template lwc:if={hasWoNotes}>
                    <pre class="notes-history">{woNotes}</pre>
                  </template>
                  <template lwc:else>
                    <p class="wl-empty">No notes yet.</p>
                  </template>
                  <div class="form-group">
                    <label class="form-label">Add note</label>
                    <textarea
                      class="form-textarea"
                      rows="3"
                      data-id="newNote"
                      value={newNote}
                      oninput={handleNewNoteChange}
                      onkeydown={handleInputKeydown}
                    ></textarea>
                  </div>
                  <div class="form-row-2">
                    <div class="form-group">
                      <label class="form-label">Cause Code</label>
                      <select
                        class="form-select"
                        onchange={handleNotesCauseChange}
                        onkeydown={handleInputKeydown}
                      >
                        <template for:each={notesCauseOptions} for:item="opt">
                          <option
                            key={opt.value}
                            value={opt.value}
                            selected={opt.selected}
                          >
                            {opt.label}
                          </option>
                        </template>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Delay Code</label>
                      <select
                        class="form-select"
                        onchange={handleNotesDelayChange}
                        onkeydown={handleInputKeydown}
                      >
                        <template for:each={notesDelayOptions} for:item="opt">
                          <option
                            key={opt.value}
                            value={opt.value}
                            selected={opt.selected}
                          >
                            {opt.label}
                          </option>
                        </template>
                      </select>
                    </div>
                  </div>
                  <template lwc:if={notesFeedback}>
                    <p class={notesFeedbackClass}>{notesFeedback}</p>
                  </template>
                  <div class="form-actions">
                    <button
                      class="btn-save-entry"
                      onclick={handleSaveNotes}
                      disabled={notesSaveDisabled}
                    >
                      {notesSaveLabel}
                    </button>
                  </div>
                </div>
              </template>

              <template lwc:if={isRaisedTab}>
                <template lwc:if={hasRaised}>
                  <template for:each={raisedRows} for:item="t">
                    <div key={t.id} class="task-card">
                      <div class="task-card-header">
                        <span class="task-num">{t.woNumber}</span>
                        <span class={t.statusClass}>{t.status}</span>
                      </div>
                      <div class="task-subject">{t.subject}</div>
                      <template lwc:if={t.workTypeName}>
                        <span class="wt-chip">{t.workTypeName}</span>
                      </template>
                    </div>
                  </template>
                </template>
                <template lwc:else>
                  <div class="ar-empty">
                    <p>No raised tasks on this asset.</p>
                  </div>
                </template>
              </template>
            </section>
          </div>
        </template>

        <!-- Task form (PM02 create/edit) -->
        <template lwc:if={showTaskForm}>
          <div class="entry-form">
            <div class="form-group">
              <label class="form-label">Subject</label>
              <input
                type="text"
                class="form-input large"
                placeholder="e.g. Replace rotary knuckle…"
                value={taskSubject}
                oninput={handleTaskSubjectChange}
                onkeydown={handleInputKeydown}
              />
            </div>

            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea
                class="form-textarea"
                rows="2"
                data-id="taskDescription"
                placeholder="Scope of work…"
                value={taskDescription}
                oninput={handleTaskDescriptionChange}
                onkeydown={handleInputKeydown}
              ></textarea>
            </div>

            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label">Cause Code</label>
                <select
                  class="form-select"
                  onchange={handleTaskCauseChange}
                  onkeydown={handleInputKeydown}
                >
                  <template for:each={taskCauseOptions} for:item="opt">
                    <option
                      key={opt.value}
                      value={opt.value}
                      selected={opt.selected}
                    >
                      {opt.label}
                    </option>
                  </template>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Delay Code</label>
                <select
                  class="form-select"
                  onchange={handleTaskDelayChange}
                  onkeydown={handleInputKeydown}
                >
                  <template for:each={taskDelayOptions} for:item="opt">
                    <option
                      key={opt.value}
                      value={opt.value}
                      selected={opt.selected}
                    >
                      {opt.label}
                    </option>
                  </template>
                </select>
              </div>
            </div>

            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label">Start Date</label>
                <input
                  type="datetime-local"
                  class="form-input"
                  value={taskStartDate}
                  onchange={handleTaskStartDateChange}
                  onkeydown={handleInputKeydown}
                />
              </div>
              <div class="form-group">
                <label class="form-label">Duration (hrs)</label>
                <input
                  type="number"
                  class="form-input"
                  placeholder="0.0"
                  step="any"
                  value={taskDurationHours}
                  oninput={handleTaskDurationChange}
                  onkeydown={handleInputKeydown}
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Component (FLOC Desc)</label>
              <input
                type="text"
                class="form-input"
                placeholder="SAP FLOC description…"
                value={taskComponent}
                oninput={handleTaskComponentChange}
                onkeydown={handleInputKeydown}
              />
            </div>

            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label">Maintenance Order</label>
                <select
                  class="form-select"
                  onchange={handleTaskPriorityChange}
                  onkeydown={handleInputKeydown}
                >
                  <template for:each={taskPriorityOptions} for:item="opt">
                    <option
                      key={opt.value}
                      value={opt.value}
                      selected={opt.selected}
                    >
                      {opt.label}
                    </option>
                  </template>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Status</label>
                <select
                  class="form-select"
                  onchange={handleTaskStatusChange}
                  onkeydown={handleInputKeydown}
                >
                  <template for:each={taskStatusOptions} for:item="opt">
                    <option
                      key={opt.value}
                      value={opt.value}
                      selected={opt.selected}
                    >
                      {opt.label}
                    </option>
                  </template>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Comments</label>
              <textarea
                class="form-textarea"
                rows="2"
                data-id="taskComments"
                placeholder="Comments…"
                value={taskComments}
                oninput={handleTaskCommentsChange}
                onkeydown={handleInputKeydown}
              ></textarea>
            </div>

            <template lwc:if={taskFeedback}>
              <p class={taskFeedbackClass}>{taskFeedback}</p>
            </template>
            <div class="form-actions">
              <button class="btn-cancel" onclick={handleTaskCancel}>
                Cancel
              </button>
              <button
                class="btn-save-entry"
                onclick={handleTaskSave}
                disabled={isSavingTask}
              >
                {taskSaveLabel}
              </button>
            </div>
          </div>
        </template>

        <template lwc:if={showRaise}>
          <div class="raise-backdrop">
            <div class="raise-modal">
              <h3 class="raise-title">Raise Task</h3>
              <div class="form-group">
                <label class="form-label">Asset</label>
                <select
                  class="form-select"
                  onchange={handleRaiseAssetChange}
                  onkeydown={handleInputKeydown}
                >
                  <template for:each={raiseAssetOptions} for:item="o">
                    <option key={o.value} value={o.value} selected={o.selected}>
                      {o.label}
                    </option>
                  </template>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Work type</label>
                <input
                  type="text"
                  class="form-input"
                  placeholder="Search work types…"
                  value={raiseWtQuery}
                  oninput={handleRaiseWtSearch}
                  onkeydown={handleInputKeydown}
                />
                <select
                  class="form-select"
                  size="5"
                  onchange={handleRaiseWtPick}
                  onkeydown={handleInputKeydown}
                >
                  <template for:each={raiseWtOptions} for:item="o">
                    <option key={o.id} value={o.id} selected={o.selected}>
                      {o.name}
                    </option>
                  </template>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Subject</label>
                <input
                  type="text"
                  class="form-input large"
                  value={raiseSubject}
                  oninput={handleRaiseSubject}
                  onkeydown={handleInputKeydown}
                />
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea
                  class="form-textarea"
                  rows="3"
                  value={raiseDescription}
                  oninput={handleRaiseDescription}
                  onkeydown={handleInputKeydown}
                ></textarea>
              </div>
              <template lwc:if={raiseFeedback}>
                <p class="form-feedback error">{raiseFeedback}</p>
              </template>
              <div class="form-actions">
                <button class="btn-cancel" onclick={handleRaiseCancel}>
                  Cancel
                </button>
                <button
                  class="btn-save-entry"
                  onclick={handleRaiseSave}
                  disabled={raiseSaving}
                >
                  {raiseSaveLabel}
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
