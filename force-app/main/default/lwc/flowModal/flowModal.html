<template>
    <lightning-modal-header label="Execute Work Step Action"></lightning-modal-header>
    <lightning-modal-body class="modal-body">
        <iframe
            src={flowUrl}
            class="flow-frame"
            title="Work Step Action"
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups">
        </iframe>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleCancel}>
        </lightning-button>
        <lightning-button
            variant="brand"
            label="Mark Complete"
            onclick={handleComplete}>
        </lightning-button>
    </lightning-modal-footer>
</template>
