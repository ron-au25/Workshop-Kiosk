<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Asset Review v5 — work-type focus, real plan/parts panels, map highlight
    </title>
    <style>
      :root {
        --bg: #0b0f14;
        --s1: #131a22;
        --s2: #1b2530;
        --s3: #243040;
        --bd: #2a3744;
        --tx: #f2f5f7;
        --mu: #a6b2bd;
        --dim: #6b7a89;
        --ac: #e25822;
        --ach: #f06a2a;
        --ac2: #2e8fe6;
        --ok: #21c07a;
        --warn: #f2b441;
        --bad: #e84b4b;
        --vio: #9b7bea;
        --r: 14px;
        --rs: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.4 -apple-system,
          "SF Pro Text",
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      .card {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: var(--r);
      }
      .chip {
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--s3);
        color: var(--mu);
        font-size: 13px;
        white-space: nowrap;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .s-grey {
        background: var(--dim);
      }
      .s-amber {
        background: var(--warn);
      }
      .s-red {
        background: var(--bad);
      }
      .s-green {
        background: var(--ok);
      }
      .btn {
        min-height: 48px;
        padding: 0 18px;
        border-radius: var(--rs);
        font-weight: 600;
        white-space: nowrap;
      }
      .btn-sm {
        min-height: 40px;
        padding: 0 14px;
        font-size: 14px;
      }
      .btn-p {
        background: var(--ac);
        color: #fff;
      }
      .btn-p:hover {
        background: var(--ach);
      }
      .btn-g {
        background: var(--s2);
        border: 1px solid var(--bd);
        color: var(--mu);
      }
      .btn-b {
        background: var(--ac2);
        color: #fff;
      }
      .sec-t {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .tag {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--s3);
        color: var(--mu);
        white-space: nowrap;
      }
      .tag.wt {
        background: rgba(46, 143, 230, 0.16);
        color: var(--ac2);
      }
      .tag.bad {
        background: rgba(232, 75, 75, 0.18);
        color: var(--bad);
      }
      .tag.warn {
        background: rgba(242, 180, 65, 0.18);
        color: var(--warn);
      }
      .tag.rt {
        background: rgba(155, 123, 234, 0.2);
        color: var(--vio);
        font-weight: 700;
      }
      .tag.asset {
        background: transparent;
        border: 1px solid var(--bd);
      }
      button.tag {
        cursor: pointer;
      }
      .pill {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: var(--s3);
        color: var(--mu);
      }
      .pill.ip {
        background: rgba(242, 180, 65, 0.2);
        color: var(--warn);
      }
      .pill.cpl {
        background: rgba(33, 192, 122, 0.2);
        color: var(--ok);
      }

      /* ── kiosk shell (mirrors kioskSidebar + kioskHeader) ── */
      .app {
        display: grid;
        grid-template-columns: 230px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: var(--s1);
        border-right: 1px solid var(--bd);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 16px;
      }
      .logo .i {
        font-size: 26px;
      }
      .logo .t {
        font-weight: 800;
      }
      .logo .s {
        font-size: 12px;
        color: var(--dim);
      }
      .sup {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 10px;
        background: var(--s2);
        margin-bottom: 14px;
        font-size: 13px;
      }
      .sup .l {
        color: var(--dim);
        font-size: 11px;
      }
      .nav {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 10px;
        color: var(--mu);
        font-weight: 600;
        text-align: left;
        margin-bottom: 4px;
        min-height: 48px;
      }
      .nav:hover {
        background: var(--s2);
      }
      .nav.on {
        background: rgba(226, 88, 34, 0.14);
        color: var(--tx);
        box-shadow: inset 3px 0 0 var(--ac);
      }
      .nav .new {
        margin-left: auto;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(155, 123, 234, 0.2);
        color: var(--vio);
      }
      .sb-foot {
        margin-top: auto;
        border-top: 1px solid var(--bd);
        padding-top: 10px;
      }
      .sb-foot .nav {
        font-weight: 500;
      }
      .sb-foot .danger {
        color: var(--bad);
      }
      .ver {
        font-size: 11px;
        color: var(--dim);
        padding: 0 12px 6px;
      }
      .khdr {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 24px;
        background: var(--s1);
        border-bottom: 1px solid var(--bd);
        position: sticky;
        top: 0;
        z-index: 7;
      }
      .khdr .terr {
        font-weight: 700;
      }
      .khdr .crew {
        color: var(--mu);
        font-size: 14px;
      }
      .khdr .time {
        margin: 0 auto;
        font-variant-numeric: tabular-nums;
        color: var(--mu);
        font-weight: 600;
      }
      .worker {
        display: flex;
        align-items: center;
        gap: 0;
        border-radius: 999px;
        background: var(--s2);
        border: 1px solid var(--bd);
        overflow: hidden;
      }
      .worker .who {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        min-height: 44px;
        font-weight: 600;
      }
      .worker .who i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ok);
      }
      .clockb {
        min-height: 44px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        border-left: 1px solid var(--bd);
        color: var(--mu);
      }
      .clockb.on {
        background: rgba(33, 192, 122, 0.16);
        color: var(--ok);
      }
      .clockb .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--dim);
      }
      .clockb.on .pulse {
        background: var(--ok);
        animation: pl 1.6s infinite;
      }
      @keyframes pl {
        0% {
          box-shadow: 0 0 0 0 rgba(33, 192, 122, 0.6);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(33, 192, 122, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(33, 192, 122, 0);
        }
      }
      .main {
        min-width: 0;
      }

      /* page bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--bd);
        background: var(--bg);
        position: sticky;
        top: 65px;
        z-index: 6;
      }
      .back {
        min-height: 44px;
        padding: 0 16px;
        border-radius: var(--rs);
        background: var(--s2);
        border: 1px solid var(--bd);
        color: var(--mu);
      }
      .tb-title {
        font-size: 21px;
        font-weight: 700;
      }
      .tb-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--mu);
        font-size: 14px;
      }
      .bar {
        width: 120px;
        height: 8px;
        border-radius: 4px;
        background: var(--s3);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .ds {
        display: flex;
        border: 1px solid var(--bd);
        border-radius: var(--rs);
        overflow: hidden;
      }
      .ds button {
        padding: 8px 12px;
        font-size: 13px;
        color: var(--mu);
      }
      .ds button.on {
        background: var(--ac2);
        color: #fff;
      }
      .dashed {
        min-height: 38px;
        padding: 0 12px;
        border-radius: var(--rs);
        border: 1px dashed var(--ac2);
        color: var(--ac2);
        font-size: 13px;
      }

      .wrap {
        padding: 16px 24px 40px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .atile {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
      }
      .atile h2 {
        margin: 0;
        font-size: 20px;
      }
      .kv {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .kv .k {
        font-size: 11px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .kv .v {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kvs {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
      }
      .atile .right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex: none;
      }

      .map {
        padding: 12px 16px 14px;
      }
      .map-h {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .crumb {
        padding: 6px 10px;
        border-radius: 8px;
        color: var(--mu);
        font-size: 14px;
      }
      .crumb:hover {
        background: var(--s2);
      }
      .crumb.cur {
        color: var(--tx);
        font-weight: 700;
      }
      .crumb-sep {
        color: var(--dim);
      }
      .map-h .right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: flex;
        border: 1px solid var(--bd);
        border-radius: var(--rs);
        overflow: hidden;
      }
      .seg button {
        padding: 8px 14px;
        font-size: 14px;
        color: var(--mu);
        min-height: 40px;
      }
      .seg button.on {
        background: var(--ac2);
        color: #fff;
        font-weight: 600;
      }
      .ice {
        position: relative;
      }
      .ice-row-l {
        position: absolute;
        left: 0;
        width: 30px;
        font-size: 11px;
        color: var(--dim);
        display: flex;
        align-items: center;
      }
      .blk {
        position: absolute;
        border-radius: 8px;
        padding: 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        text-align: left;
        background: var(--s2);
        border: 1px solid var(--bd);
        font-size: 14px;
      }
      .blk:hover {
        border-color: var(--mu);
      }
      .blk.sel {
        border: 2px solid var(--ac);
        background: rgba(226, 88, 34, 0.14);
      }
      .blk.path {
        background: var(--s3);
      }
      .blk .bn {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .bc {
        font-size: 12px;
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(46, 143, 230, 0.22);
        color: var(--ac2);
        font-weight: 700;
      }
      .blk.st-red {
        box-shadow: inset 4px 0 0 var(--bad);
      }
      .blk.st-amber {
        box-shadow: inset 4px 0 0 var(--warn);
      }
      .blk.st-green {
        box-shadow: inset 4px 0 0 var(--ok);
      }
      .blk.st-grey {
        box-shadow: inset 4px 0 0 var(--dim);
      }
      .blk .zoom {
        font-size: 12px;
        color: var(--dim);
      }
      .schem {
        position: relative;
      }
      .schem img {
        width: 100%;
        display: block;
        border-radius: 8px;
        opacity: 0.85;
      }
      .schem .zone {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 8px;
        border: 2px solid transparent;
        display: flex;
        justify-content: center;
        padding-top: 6px;
      }
      .schem .zone.sel {
        border-color: var(--ac);
        background: rgba(226, 88, 34, 0.12);
      }
      .legend {
        display: flex;
        gap: 14px;
        font-size: 12px;
        color: var(--mu);
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .body {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 16px;
        align-items: start;
      }
      .wol {
        padding: 12px;
        position: sticky;
        top: 140px;
        max-height: calc(100vh - 156px);
        overflow: auto;
      }
      .wol-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 10px;
      }
      .wol-h .t {
        font-weight: 700;
        font-size: 17px;
        flex: 1;
      }
      .tog {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--mu);
        padding: 0 4px 10px;
      }
      .sw {
        width: 40px;
        height: 24px;
        border-radius: 12px;
        background: var(--s3);
        position: relative;
        flex: none;
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--mu);
        transition: left 0.2s;
      }
      .sw.on {
        background: var(--ac2);
      }
      .sw.on::after {
        left: 19px;
        background: #fff;
      }
      .grp {
        font-size: 12px;
        color: var(--dim);
        padding: 10px 6px 6px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .woc {
        width: 100%;
        text-align: left;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 10px;
        padding: 12px;
        border-radius: 12px;
        background: var(--s2);
        border: 1px solid transparent;
        margin-bottom: 8px;
      }
      .woc:hover {
        border-color: var(--bd);
      }
      .woc.sel {
        border-color: var(--ac);
        background: rgba(226, 88, 34, 0.08);
      }
      .woc .n {
        font-weight: 700;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .woc .sj {
        grid-column: 1 / 2;
        color: var(--mu);
        font-size: 14px;
      }
      .woc .meta {
        grid-column: 1 / -1;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .woc .ring {
        grid-row: 1 / 3;
        grid-column: 2;
      }
      .ring {
        width: 42px;
        height: 42px;
      }

      .ws {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .ws-h {
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ws-h .top {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .ws-h h1 {
        margin: 0;
        font-size: 21px;
        flex: 1;
      }
      .next {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        border-left: 6px solid var(--ac);
        background: linear-gradient(
          90deg,
          rgba(226, 88, 34, 0.14),
          var(--s1) 60%
        );
      }
      .next.ok {
        border-left-color: var(--ok);
        background: linear-gradient(
          90deg,
          rgba(33, 192, 122, 0.14),
          var(--s1) 60%
        );
      }
      .next.warn {
        border-left-color: var(--warn);
        background: linear-gradient(
          90deg,
          rgba(242, 180, 65, 0.14),
          var(--s1) 60%
        );
      }
      .next .txt {
        font-size: 19px;
        font-weight: 600;
      }
      .next .btn {
        margin-left: auto;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        overflow: hidden;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        min-height: 66px;
        text-align: left;
        border-right: 1px solid var(--bd);
      }
      .tab:last-child {
        border-right: none;
      }
      .tab.on {
        background: var(--s2);
        box-shadow: inset 0 -3px 0 var(--ac);
      }
      .tab .ic {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: var(--s3);
        color: var(--mu);
        flex: none;
        font-size: 15px;
      }
      .tab.done .ic {
        background: var(--ok);
        color: #05210f;
      }
      .tab.warn .ic,
      .tab.prog .ic {
        background: var(--warn);
        color: #2b1d00;
      }
      .tab .t {
        font-weight: 700;
      }
      .tab .d {
        font-size: 12px;
        color: var(--mu);
      }
      .panel {
        padding: 16px 18px;
      }
      .ph {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .ph h2 {
        margin: 0;
        font-size: 18px;
      }
      .ph .hint {
        color: var(--dim);
        font-size: 13px;
      }
      .ph .right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* measures */
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 8px;
        align-items: stretch;
      }
      .pair .mrow {
        margin-bottom: 0;
        height: 100%;
      }
      .mrow {
        display: grid;
        grid-template-columns: 1fr 96px;
        gap: 8px 12px;
        align-items: center;
        padding: 12px;
        border-radius: 10px;
        background: var(--s2);
        margin-bottom: 8px;
        border-left: 4px solid var(--s3);
      }
      .mrow.o-ok {
        border-left-color: var(--ok);
      }
      .mrow.o-m {
        border-left-color: var(--ac2);
      }
      .mrow.o-att {
        border-left-color: var(--warn);
      }
      .mrow.o-sc {
        border-left-color: var(--bad);
      }
      .mrow.hl {
        outline: 2px solid var(--ac2);
      }
      .mrow .c {
        font-weight: 600;
      }
      .mrow .l {
        font-size: 13px;
        color: var(--mu);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 4px;
      }
      .mrow .v {
        font-size: 20px;
        font-weight: 700;
        text-align: right;
      }
      .mrow .v small {
        font-size: 12px;
        color: var(--dim);
        font-weight: 400;
        margin-left: 3px;
      }
      .vin {
        width: 96px;
        min-height: 42px;
        border-radius: 8px;
        background: var(--s3);
        border: 1px solid var(--bd);
        color: var(--tx);
        padding: 0 10px;
        font: inherit;
        text-align: right;
      }
      .outs {
        grid-column: 1 / -1;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .out {
        min-height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        background: var(--s3);
        color: var(--mu);
        font-size: 14px;
        font-weight: 600;
        border: 1px solid transparent;
      }
      .out.on.ok {
        background: rgba(33, 192, 122, 0.2);
        border-color: var(--ok);
        color: var(--ok);
      }
      .out.on.att {
        background: rgba(242, 180, 65, 0.2);
        border-color: var(--warn);
        color: var(--warn);
      }
      .out.on.sc {
        background: rgba(232, 75, 75, 0.2);
        border-color: var(--bad);
        color: var(--bad);
      }
      .out.r {
        margin-left: auto;
      }
      .out.sel {
        background: var(--s1);
        border-color: var(--ac2);
        color: var(--ac2);
      }
      .mdet {

        n
          .replace(/^MEL-SEED (HT02 )?/, "")
          .replace(/^HT-02 — /, "")
          .replace(/^20213 /, "");
      const unit = (vt) =>
        ({
          Temperature: "°C",
          Pressure: "bar",
          Depth: "mm",
          Width: "mm",
          Length: "mm"
        })[vt] || "";
      const isF = (m) => m.out === "Attention Required" || m.out === "Scrap";
      const esc = (s) =>
        String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      const raisedOn = (id) => {
        const ids = desc(id);
        return [
          ...D.raisedHistory,
          ...D.wos
            .filter((w) => w.raised)
            .map((w) => ({ ...w, date: "2026-08-18", wp: D.wp }))
        ].filter((r) => ids.includes(r.assetId));
      };

      /* sample history: same Component_Name__c on the same asset in earlier WOs (deterministic) */
      function hash(s) {
        let h = 7;
        for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 100000;
        return h;
      }
      const PAST = [
        ["2026-02-11", "00009812"],
        ["2026-04-09", "00010440"],
        ["2026-06-02", "00011207"],
        ["2026-07-21", "00011893"]
      ];
      const BASE = {
        Temperature: 60,
        Pressure: 22,
        Depth: 26,
        Width: 0.4,
        Length: 12
      };
      function hist(w, m) {
        const h = hash(w.assetId + m.comp);
        if (NUMERIC.includes(m.vt)) {
          const b = m.val != null ? m.val * (isF(m) ? 0.85 : 1) : BASE[m.vt];
          return PAST.map(([dt, n], i) => ({
            dt,
            n,
            v: +(b * (0.9 + ((h >> i) % 13) / 100)).toFixed(
              m.vt === "Width" ? 2 : 1
            )
          }));
        }
        const outs = ["OK", "OK", "OK", "Attention Required"];
        return PAST.slice(1).map(([dt, n], i) => ({
          dt,
          n,
          out: outs[(h + i) % 4]
        }));
      }

      /* work-type focus: distinct WorkType.Name of WOs under the workpack (RootWorkOrderId = workpack) */
      const wpTypes = () => {
        const c = {};
        D.wos
          .filter((w) => !w.isWp)
          .forEach((w) => (c[w.wt] = (c[w.wt] || 0) + 1));
        return Object.entries(c).sort((a, b) => a[0].localeCompare(b[0]));
      };
      const fOn = () => CFG.wtFilter && S.wtf.length;
      const inF = (w) => w.isWp || !fOn() || S.wtf.includes(w.wt);
      const vis = () => D.wos.filter(inF);
      function wtfHtml() {
        if (!CFG.wtFilter) return "";
        const t = wpTypes();
        return `<div class="card wtf"><span class="lbl">${ic("filter")} Focus on work types</span>
    ${t.map(([n, c], i) => `<button class="wtc ${S.wtf.includes(n) ? "on" : ""}" onclick="togWt(${i})">${S.wtf.includes(n) ? "✓ " : ""}${esc(n)}<span class="n">${c}</span></button>`).join("")}
    ${S.wtf.length ? `<button class="clr" onclick="S.wtf=[];render()">Show all · ${S.wtf.length} selected ✕</button>` : '<span class="clr" style="color:var(--dim)">None selected = all</span>'}</div>`;
      }
      function togWt(idx) {
        const n = wpTypes()[idx][0],
          i = S.wtf.indexOf(n);
        i >= 0 ? S.wtf.splice(i, 1) : S.wtf.push(n);
        if (!inF(wo(S.wo))) {
          const f = vis().find((w) => !w.isWp);
          if (f) return selWo(f.num);
          S.wo = D.wos[0].num;
        }
        render();
      }
      function woD(w) {
        const pend = w.measures.filter((m) => !m.out),
          finds = w.measures.filter(isF),
          bare = finds.filter((m) => !m.comments.trim());
        const work = w.plans.filter((p) => !p.exception);
        const st = work.flatMap((p) => p.steps),
          sd = st.filter((s) => s.d).length;
        const shortP = w.parts.filter((p) => p.used < p.req);
        let status = "grey";
        const done =
          (st.length ? sd === st.length : true) &&
          !pend.length &&
          !shortP.length &&
          (st.length || w.measures.length || w.parts.length);
        if (w.status === "Completed" || done) status = "green";
        else if (finds.length) status = "red";
        else if (
          w.status === "In Progress" ||
          sd ||
          w.measures.some((m) => m.out)
        )
          status = "amber";
        return { pend, finds, bare, st, sd, short: shortP, status };
      }
      function assetStatus(id) {
        const ids = desc(id),
          ws = vis().filter((w) => ids.includes(w.assetId));
        if (!ws.length) return "grey";
        const st = ws.map((w) => woD(w).status);
        if (st.includes("red")) return "red";
        if (st.every((s) => s === "green")) return "green";
        if (st.some((s) => s !== "grey")) return "amber";
        return "grey";
      }
      const openWoCount = (id) =>
        vis().filter(
          (w) =>
            desc(id).includes(w.assetId) && !w.isWp && woD(w).status !== "green"
        ).length;
      function fv(rec, f, isWo) {
        if (isWo) {
          if (f === "WorkType") return rec.wt;
          if (f === "Status") return rec.status;
          if (f === "WorkOrderNumber") return rec.num;
          if (f === "Critical_Path__c") return rec[f] ? "Yes" : "No";
          if (f === "Est_Parts_Cost__c")
            return (
              "$" + rec.parts.reduce((a, p) => a + p.req * p.cost, 0).toFixed(0)
            );
        }
        if (!isWo && f === "Asset_Type__c") return rec.type;
        if (!isWo && f === "Name") return rec.name;
        return rec[f] ?? "—";
      }

      /* ───────────── shell ───────────── */
      function renderSidebar() {
        const item = (k, ic, l, extra = "") =>
          `<button class="nav ${NAV === k ? "on" : ""}" onclick="go('${k}')"><span>${ic}</span>${l}${extra}</button>`;
        put(
          document.getElementById("sidebar"),
          `
    <div class="logo"><span class="i">⚙</span><div><div class="t">Workshop</div><div class="s">MEL Workshop</div></div></div>
    <div class="sup"><span>👷</span><div><div class="l">Supervisor</div>R. Shpilman</div></div>
    ${item("dashboard", "📊", "Dashboard")}${item("workorders", "🔧", "Work Orders")}${item("timetracking", "⏱", "Time Tracking")}${item("config", "🛠", "Kiosk Config", '<span class="new">NEW</span>')}
    <div class="sb-foot"><div class="ver">v1.x</div><button class="nav">🌙 Dark</button><button class="nav">🔄 Switch Worker</button><button class="nav danger">⏻ End Shift</button></div>`
        );
      }
      function go(k) {
        NAV = k;
        render();
        window.scrollTo(0, 0);
      }
      setInterval(() => {
        const t = document.getElementById("hdrTime");
        if (t)
          t.textContent = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          });
      }, 1000);

      /* clock (in the worker chip of kioskHeader → every page) */
      let CLOCK = { on: false, wp: null, title: "", start: 0 };
      const WORKPACKS = [
        ["00012423", "MEL-SEED Haul Truck HT-02"],
        ["00010070", "WG 20213"],
        ["00012300", "MEL-SEED Haul Truck HT-01"]
      ];
      const fmtT = (ms) => {
        const s = Math.floor(ms / 1000);
        return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
      };
      function renderClock() {
        const el = document.getElementById("clock");
        el.className = "clockb" + (CLOCK.on ? " on" : "");
        put(
          el,
          CLOCK.on
            ? `<span class="pulse"></span>⏱ ${fmtT(Date.now() - CLOCK.start)} · ${CLOCK.wp} ▾`
            : `<span class="pulse"></span>Clock in ▾`
        );
      }
      setInterval(() => CLOCK.on && renderClock(), 1000);
      const ctxWp = () => (NAV === "workorders" ? D.wp : null);
      function clockIn(wp) {
        CLOCK = {
          on: true,
          wp,
          title: (WORKPACKS.find((x) => x[0] === wp) || ["", ""])[1],
          start: Date.now()
        };
        renderClock();
      }
      function autoClock() {
        if (!CLOCK.on) {
          clockIn(D.wp);
          toast(`Auto clocked in on workpack ${D.wp}`);
        }
      }
      function openClock() {
        const others = WORKPACKS.filter(([n]) => n !== CLOCK.wp),
          c = ctxWp();
        openDrawer(`<h3>⏱ Time clock<button class="x" onclick="closeAll()">✕</button></h3>
    <div class="sub">J. Smith · from any page. One open clock per worker, at workpack level.</div>
    ${
      CLOCK.on
        ? `<div class="card" style="padding:16px;margin-bottom:16px;border-color:var(--ok)"><div class="sec-t">Clocked in</div><div class="clk-big">${fmtT(Date.now() - CLOCK.start)}</div>
        <div style="color:var(--mu);margin-bottom:12px">Workpack ${CLOCK.wp} · ${CLOCK.title}</div>
        <button class="btn btn-p" style="width:100%" onclick="CLOCK.on=false;renderClock();closeAll();toast('Clocked out')">Clock out</button></div>
      <div class="sec-t" style="margin-bottom:8px">Switch workpack (clocks out the current one)</div>`
        : `<div class="sec-t" style="margin-bottom:8px">Clock in to</div>`
    }
    ${others.map(([n, t]) => `<button class="wpl ${n === c ? "ctx" : ""}" onclick="toast('${CLOCK.on ? "Switched" : "Clocked in"} to ${n}');clockIn('${n}');closeAll()"><b>${n}</b><span style="flex:1;color:var(--mu)">${t}</span>${n === c ? '<span class="tag wt">this page</span>' : ""}</button>`).join("")}
    <div style="font-size:13px;color:var(--dim);margin-top:10px">${c ? "" : "No workpack on this page: list = assigned / recent workpacks. "}Scan a WO barcode to pick.</div>`);
      }

      /* ───────────── pages ───────────── */
      function render() {
        renderSidebar();
        renderClock();
        const pg = document.getElementById("page");
        if (NAV === "config") return put(pg, configPage());
        if (NAV !== "workorders")
          return put(
            pg,
            `<div class="wrap"><div class="card empty" style="padding:80px">${NAV === "timetracking" ? "⏱ Existing Time Tracking page (timeTrackingDashboard)" : "📊 Existing Dashboard"}. Unchanged.<br><br>Note the clock in the header still works here.</div></div>`
          );
        const ws = vis().filter((w) => !w.isWp),
          done = ws.filter((w) => woD(w).status === "green").length;
        put(
          pg,
          `
    <div class="topbar"><button class="back">‹ Back to Workpack</button><span class="tb-title">${D.title}</span><span class="chip">Workpack ${D.wp}</span>
      <div class="tb-right"><div class="ds"><button class="${D.key === "HT" ? "on" : ""}" onclick="loadDs('HT')">HT-02 · 00012423</button><button class="${D.key === "WG" ? "on" : ""}" onclick="loadDs('WG')">WG 20213 · 00010070</button></div>
        <span>${done}/${ws.length} WOs done</span><div class="bar"><i style="width:${ws.length ? (done / ws.length) * 100 : 0}%"></i></div>
        <button class="dashed" onclick="openNotes()">ⓘ Design notes</button></div></div>
    <div class="wrap">
      ${assetTile()}
      ${wtfHtml()}
      <div class="card map">${mapHtml()}</div>
      <div class="body"><aside class="card wol">${listHtml()}</aside><main class="ws">${wsHtml()}</main></div>
    </div>`
        );
      }

      function assetTile() {
        const a = asset(S.sel),
          st = assetStatus(S.sel);
        return `<div class="card atile"><i class="dot s-${st}" style="width:16px;height:16px"></i>
    <div style="min-width:0"><div class="sec-t">Selected asset · L${depthOf(a.id) + 1}</div><h2>${esc(a.name)}</h2></div>
    <div class="kvs" style="margin-left:18px">${CFG.assetTile.map((f) => `<div class="kv"><span class="k">${ASSET_FIELDS.find((x) => x[0] === f)[1]}</span><span class="v">${esc(fv(a, f))}</span></div>`).join("")}</div>
    <div class="right"><button class="btn btn-g btn-sm" onclick="openAssetDrawer()">ⓘ Asset details</button></div></div>`;
      }

      function mapHtml() {
        const path = pathTo(S.focus);
        const crumbs = path
          .map(
            (a, i) =>
              `${i ? '<span class="crumb-sep">›</span>' : ""}<button class="crumb ${a.id === S.focus ? "cur" : ""}" onclick="zoom('${a.id}')">${i === 0 ? "⌂ " : ""}${short(a.name)}</button>`
          )
          .join("");
        const maxD = Math.max(...D.assets.map((a) => depthOf(a.id))) + 1,
          hasSchem = !!D.schematic;
        let body;
        if (S.view === "schematic" && hasSchem) {
          body = `<div class="schem"><img src="${D.schematic}" alt="Schematic" onerror="this.style.display='none'">
      ${Object.entries(D.zones)
        .map(
          ([id, z]) =>
            `<button class="zone ${desc(id).includes(S.sel) ? "sel" : ""} ${id === S.hl ? "wohl" : ""}" style="left:${z.l}%;width:${z.w}%" onclick="pick('${id}')"><i class="dot s-${assetStatus(id)}" style="width:16px;height:16px;box-shadow:0 0 0 2px #0B0F14"></i></button>`
        )
        .join("")}</div>`;
        } else {
          const ROW = 44,
            GAP = 6,
            LBL = 30,
            rows = [];
          const lay = (id, d, x0, w) => {
            rows.push({ id, d, x0, w });
            let x = x0;
            const tot = leaves(id);
            kids(id).forEach((k) => {
              const kw = (w * leaves(k.id)) / tot;
              lay(k.id, d + 1, x, kw);
              x += kw;
            });
          };
          lay(S.focus, 0, 0, 1);
          const nRows = Math.max(...rows.map((r) => r.d)) + 1,
            base = depthOf(S.focus),
            selPath = pathTo(S.sel).map((a) => a.id),
            hlPath = S.hl ? pathTo(S.hl).map((a) => a.id) : [];
          body = `<div class="ice" style="height:${nRows * (ROW + GAP)}px">
      ${Array.from({ length: nRows }, (_, i) => `<div class="ice-row-l" style="top:${i * (ROW + GAP)}px;height:${ROW}px">L${base + i + 1}</div>`).join("")}
      ${rows
        .map((r) => {
          const a = asset(r.id),
            st = assetStatus(r.id),
            oc = openWoCount(r.id),
            hasK = kids(r.id).length;
          return `<button class="blk st-${st} ${r.id === S.sel ? "sel" : ""} ${r.id === S.hl && r.id !== S.sel ? "wohl" : ""} ${(selPath.includes(r.id) || hlPath.includes(r.id)) && r.id !== S.sel && r.id !== S.hl ? "path" : ""}"
          style="top:${r.d * (ROW + GAP)}px;height:${ROW}px;left:calc(${LBL}px + (100% - ${LBL}px) * ${r.x0} + 2px);width:calc((100% - ${LBL}px) * ${r.w} - 4px)"
          title="${esc(a.name)} (${a.type})" onclick="pick('${r.id}')"><i class="dot s-${st}"></i><span class="bn">${short(a.name)}</span>${oc ? `<span class="bc">${oc}</span>` : ""}${hasK && r.d > 0 ? '<span class="zoom">⤢</span>' : ""}</button>`;
        })
        .join("")}
    </div>`;
        }
        return `<div class="map-h"><span class="sec-t">Asset map</span><div class="crumbs">${crumbs}</div>
      <div class="right"><span class="chip">${maxD} levels</span>
      <div class="seg"><button class="${S.view === "map" ? "on" : ""}" onclick="S.view='map';render()">▤ Hierarchy</button>${hasSchem ? `<button class="${S.view === "schematic" ? "on" : ""}" onclick="S.view='schematic';render()">🖼 Schematic</button>` : ""}</div></div></div>
    ${body}
    <div class="legend"><span><i class="dot s-grey"></i>Not started</span><span><i class="dot s-amber"></i>In progress</span><span><i class="dot s-red"></i>Has finding</span><span><i class="dot s-green"></i>Complete</span><span><b class="bc">n</b> open WOs</span><span><i class="dot" style="background:var(--ac)"></i>Selected asset</span><span><i class="dot" style="background:var(--ac2)"></i>Asset of selected WO</span><span>⤢ tap to zoom</span></div>`;
      }

      function listHtml() {
        const ids = S.inclSub ? desc(S.sel) : [S.sel];
        const list = vis().filter((w) => ids.includes(w.assetId) || w.isWp),
          groups = {};
        list.forEach((w) => {
          const k = w.isWp ? "__wp" : w.assetId;
          (groups[k] = groups[k] || []).push(w);
        });
        const order = ["__wp", ...ids.filter((i) => groups[i])],
          a = asset(S.sel);
        return `<div class="wol-h"><span class="t">Work orders</span><button class="btn btn-p btn-sm" onclick="openRaise()">${ic("raised")} Raise Task</button></div>${fOn() ? `<div class="tog" style="color:var(--ac2)">${ic("filter")} Focus: ${S.wtf.map(esc).join(", ")}</div>` : ""}
    <div class="tog"><button class="sw ${S.inclSub ? "on" : ""}" onclick="S.inclSub=!S.inclSub;render()"></button>Include sub-assets of <b style="color:var(--tx)">${short(a.name)}</b></div>
    ${order.map((k) => `<div class="grp">${k === "__wp" ? "📦 Workpack" : "⚙ " + short(asset(k).name)}</div>${groups[k].map(woCard).join("")}`).join("")}
    ${list.filter((w) => !w.isWp).length ? "" : `<div class="empty">No work orders on ${short(a.name)}${fOn() ? " for the selected work types" : ""}.</div>`}`;
      }
      function woCard(w) {
        const d = woD(w);
        return `<button class="woc ${S.wo === w.num ? "sel" : ""}" onclick="selWo('${w.num}')">
    <span class="n"><i class="dot s-${d.status}"></i>${w.num}<span class="pill ${w.status === "In Progress" ? "ip" : w.status === "Completed" ? "cpl" : ""}">${w.status}</span>${w.raised ? '<span class="tag rt">RAISED</span>' : ""}</span>
    ${ring(d.sd, d.st.length)}
    <span class="sj">${esc(w.subject)}</span>
    <span class="meta"><span class="tag wt">${w.wt}</span>${d.pend.length ? `<span class="tag">${d.pend.length} to measure</span>` : ""}${d.finds.length ? `<span class="tag bad">${d.finds.length} finding</span>` : ""}${d.short.length ? `<span class="tag warn">${d.short.length} parts</span>` : ""}</span></button>`;
      }
      function ring(done, total) {
        const r = 16,
          C = 2 * Math.PI * r,
          p = total ? done / total : 0;
        return `<svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="none" stroke="#243040" stroke-width="4"/>
    <circle cx="20" cy="20" r="${r}" fill="none" stroke="${p === 1 ? "#21C07A" : "#F2B441"}" stroke-width="4" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" transform="rotate(-90 20 20)" stroke-linecap="round"/>
    <text x="20" y="20" fill="#F2F5F7" font-size="10" text-anchor="middle" dominant-baseline="central">${total ? Math.round(p * 100) + "%" : "—"}</text></svg>`;
      }

      function nextFor(w, d) {
        if (d.pend.length)
          return {
            c: "",
            t: `Record ${d.pend.length} measure${d.pend.length > 1 ? "s" : ""}. Next: ${d.pend[0].comp}`,
            b: "Measure",
            go: `S.tab='measure';render()`
          };
        if (d.bare.length)
          return {
            c: "warn",
            t: `Finding “${d.bare[0].comp}” has no comment. Describe it`,
            b: "Add comment",
            go: `S.tab='measure';S.open='${d.bare[0].id}';render()`
          };
        for (const p of w.plans.filter((p) => !p.exception)) {
          const s = p.steps.find((s) => !s.d);
          if (s)
            return {
              c: "",
              t: `${p.n}: “${s.n}”`,
              b: "Execute",
              go: `S.tab='execute';S.exp['${w.num}_${w.plans.indexOf(p)}']=true;render()`
            };
        }
        if (d.short.length)
          return {
            c: "",
            t: `Consume ${d.short.length} part line${d.short.length > 1 ? "s" : ""} (${d.short[0].n})`,
            b: "Parts",
            go: "setTab('parts')"
          };
        if (!w.measures.length && !w.plans.length)
          return {
            c: "",
            t: "No requirements on this WO yet. Add notes, parts or measures",
            b: "Notes",
            go: "setTab('notes')"
          };
        return { c: "ok", t: "Work order complete", b: null };
      }

      function wsHtml() {
        const w = wo(S.wo);
        if (!w) return `<div class="card empty">Select a work order.</div>`;
        const d = woD(w),
          n = nextFor(w, d),
          a = asset(w.assetId),
          rc = raisedOn(w.assetId).length;
        const tabState = {
          measure: d.bare.length
            ? "warn"
            : !d.pend.length && w.measures.length
              ? "done"
              : w.measures.some((m) => m.out)
                ? "prog"
                : "",
          execute:
            d.st.length && d.sd === d.st.length ? "done" : d.sd ? "prog" : "",
          parts: !w.parts.length
            ? ""
            : !d.short.length
              ? "done"
              : w.parts.some((p) => p.used)
                ? "prog"
                : "",
          notes: "",
          raised: ""
        };
        const tabs = [
          [
            "measure",
            "measure",
            "Measure",
            w.measures.length
              ? `${w.measures.length - d.pend.length}/${w.measures.length} recorded${d.finds.length ? ` · ${d.finds.length} finding` : ""}`
              : "None"
          ],
          [
            "execute",
            "execute",
            "Execute",
            w.plans.length
              ? `${w.plans.length} plans · ${d.sd}/${d.st.length} steps`
              : "No work plan"
          ],
          [
            "parts",
            "parts",
            "Parts",
            w.parts.length
              ? `${w.parts.length - d.short.length}/${w.parts.length} consumed`
              : "None required"
          ],
          [
            "notes",
            "notes",
            "Notes & codes",
            `${w.notes.length} note${w.notes.length === 1 ? "" : "s"}`
          ],
          ["raised", "raised", "Raised tasks", `${rc} on ${short(a.name)}`]
        ];
        const body = {
          measure: measureView,
          execute: executeView,
          parts: partsView,
          notes: notesView,
          raised: raisedView
        }[S.tab](w, d);
        return `
    <div class="card ws-h"><div class="top"><i class="dot s-${d.status}" style="width:16px;height:16px"></i><h1>${w.num} · ${esc(w.subject)}</h1>${w.raised ? '<span class="tag rt">RAISED TASK</span>' : ""}<span class="chip">⚙ ${short(a.name)}</span></div>
      <div class="kvs">${CFG.woTile.map((f) => `<div class="kv"><span class="k">${WO_FIELDS.find((x) => x[0] === f)[1]}</span><span class="v">${esc(fv(w, f, true))}</span></div>`).join("")}</div></div>
    <div class="card next ${n.c}"><div><div class="sec-t">Next step</div><div class="txt">${esc(n.t)}</div></div>${n.b ? `<button class="btn ${n.c === "ok" ? "btn-b" : "btn-p"}" onclick="${n.go}">${n.b} →</button>` : ""}</div>
    <div class="card tabs">${tabs
      .map(([k, icn, t, dd]) => {
        const st = tabState[k];
        return `<button class="tab ${S.tab === k ? "on" : ""} ${st}" onclick="setTab('${k}')"><span class="ic">${ic(icn)}</span><span><div class="t">${t}</div><div class="d">${dd}</div></span></button>`;
      })
      .join("")}</div>
    <div class="card panel">${body}</div>`;
      }

      /* ── Measure tab ── */
      function mCard(w, m) {
        const oc =
            {
              OK: "o-ok",
              Measure: "o-m",
              "Attention Required": "o-att",
              Scrap: "o-sc"
            }[m.out] || "",
          open = S.open === m.id,
          numeric = NUMERIC.includes(m.vt);
        const ob = (o, c, l) =>
          `<button class="out ${m.out === o ? "on " + c : ""}" onclick="setOut('${w.num}','${m.id}','${o}')">${l}</button>`;
        return `<div class="mrow ${oc} ${S.side === "doc" && S.docRow === m.id ? "hl" : ""}">
    <div><div class="c">${esc(m.comp)}</div>
      <div class="l"><button class="tag wt" onclick="showInDoc('${m.id}',${m.pg})" title="${esc(m.src)}">📄 ${esc(m.src.replace(/\.pdf$/, "").slice(0, 30))}… · p.${m.pg}</button>${m.loc ? `<span class="tag asset">📍 ${m.loc}</span>` : ""}</div>
      <div class="l">${m.at ? `<span class="when">🕒 Captured ${m.at}</span>` : "<i>Not recorded</i>"}${m.comments ? `<span>💬 ${esc(m.comments)}</span>` : ""}${m.review ? `<span>📝 ${esc(m.review)}</span>` : ""}</div></div>
    <div class="v">${m.val == null ? (numeric ? `<input class="vin" inputmode="decimal" placeholder="${unit(m.vt) || m.vt}" onchange="setVal('${w.num}','${m.id}',this.value)">` : "") : `${m.val}<small>${unit(m.vt)}</small>`}</div>
    <div class="outs">${ob("OK", "ok", "✓ OK")}${ob("Attention Required", "att", "⚠ Attention")}${ob("Scrap", "sc", "✕ Scrap")}
      <button class="out" onclick="toast('Camera / attach image to measure')">📷</button>
      <button class="out r ${open ? "sel" : ""}" onclick="S.open=S.open==='${m.id}'?null:'${m.id}';render()">${ic("edit")} Edit</button></div>
    ${
      open
        ? `<div class="mdet">
      ${isF(m) && !m.comments.trim() ? `<div class="warnline">⚠ Describe the finding. Attention Required + comment also triggers the notification Case flow.</div>` : ""}
      <div class="f full"><label>Comments</label><textarea rows="2" id="mc_${m.id}">${esc(m.comments)}</textarea></div>
      <div class="f full"><label>Review notes</label><textarea rows="2" id="mr_${m.id}">${esc(m.review)}</textarea></div>
      <div class="f"><label>Defect location</label><select id="ml_${m.id}"><option value="">—</option>${DEFECT_LOC.map((x) => `<option ${m.loc === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
      <div class="f"><label>Page # <span class="fut">future field</span></label><input disabled value="${m.pg}"></div>
      <div class="f full"><label>Source document <span class="fut">future field</span></label><div class="ro">📄 ${esc(m.src)}</div></div>
      <div class="full" style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-g btn-sm" onclick="S.open=null;render()">Cancel</button><button class="btn btn-b btn-sm" onclick="saveMeta('${w.num}','${m.id}')">Save</button></div>
    </div>`
        : ""
    }
  </div>`;
      }
      function trendCell(w, m) {
        const h = hist(w, m),
          numeric = NUMERIC.includes(m.vt);
        if (!numeric) {
          const pts = [
            ...h,
            { dt: "2026-08-18", n: w.num, out: m.out, cur: true }
          ];
          const col = (o) =>
            ({
              OK: "#21C07A",
              "Attention Required": "#F2B441",
              Scrap: "#E84B4B",
              Measure: "#2E8FE6"
            })[o] || "#243040";
          return `<div class="tcell"><div class="th"><b>Outcome history · ${esc(m.comp)}</b><span>${short(asset(w.assetId).name)}</span></div>
      <div class="otl">${pts.map((p) => `<div class="o ${p.cur ? "cur" : ""}"><i style="background:${col(p.out)};${p.cur && !p.out ? "border:2px dashed #6B7A89" : ""}"></i>${p.dt.slice(5)}<span>${p.cur ? "this WO" : p.n}</span></div>`).join("")}</div></div>`;
        }
        const pts = [
          ...h,
          ...(m.val != null
            ? [{ dt: "2026-08-18", n: w.num, v: m.val, cur: true }]
            : [])
        ];
        const W = 320,
          H = 110,
          L = 34,
          R = 26,
          T = 10,
          B = 30,
          vals = pts.map((p) => p.v),
          mn = Math.min(...vals),
          mx = Math.max(...vals),
          pad = (mx - mn || mx * 0.1 || 1) * 0.25;
        const lo = mn - pad,
          hi = mx + pad,
          n = pts.length + (m.val == null ? 1 : 0);
        const sx = (i) => L + (i * (W - L - R)) / Math.max(1, n - 1),
          sy = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
        const last = pts[pts.length - 1],
          prev = pts[pts.length - 2],
          delta = last && prev ? last.v - prev.v : 0;
        return `<div class="tcell"><div class="th"><b>${esc(m.comp)} · ${unit(m.vt) || m.vt}</b><span>${m.val != null && prev ? `${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta).toFixed(1)} vs ${prev.n}` : "awaiting this WO’s reading"}</span></div>
    <svg viewBox="0 0 ${W} ${H}">
      ${[lo, (lo + hi) / 2, hi].map((t) => `<line x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}" stroke="#243040"/><text x="${L - 5}" y="${sy(t)}" fill="#6B7A89" font-size="9" text-anchor="end" dominant-baseline="central">${t.toFixed(t < 10 ? 1 : 0)}</text>`).join("")}
      <polyline fill="none" stroke="#2E8FE6" stroke-width="2" points="${pts.map((p, i) => sx(i) + "," + sy(p.v)).join(" ")}"/>
      ${pts.map((p, i) => `<circle cx="${sx(i)}" cy="${sy(p.v)}" r="${p.cur ? 5 : 3.5}" fill="${p.cur ? (isF(m) ? "#F2B441" : "#F2F5F7") : "#2E8FE6"}" stroke="#0e141b" stroke-width="1.5"/>`).join("")}
      ${m.val == null ? `<circle cx="${sx(n - 1)}" cy="${(T + H - B) / 2}" r="5" fill="none" stroke="#6B7A89" stroke-dasharray="2 2"/>` : ""}
      ${Array.from({ length: n }, (_, i) => {
        const p = pts[i] || { dt: "2026-08-18", n: w.num };
        return `<text x="${sx(i)}" y="${H - 16}" fill="${i === n - 1 ? "#F2F5F7" : "#A6B2BD"}" font-size="9" text-anchor="middle">${p.dt.slice(5)}</text><text x="${sx(i)}" y="${H - 5}" fill="#6B7A89" font-size="8" text-anchor="middle">${i === n - 1 ? "this WO" : p.n}</text>`;
      }).join("")}
    </svg></div>`;
      }
      function measureView(w) {
        const docs = D.docs;
        const head = `<div class="ph"><h2>${ic("measure")} Measures</h2><span class="hint">On ${w.num} · asset ${short(asset(w.assetId).name)} (from the WO)</span>
      <div class="right"><div class="seg"><button class="${S.side === "doc" ? "on" : ""}" onclick="S.side='doc';render()">${ic("doc")} Document</button><button class="${S.side === "trend" ? "on" : ""}" onclick="S.side='trend';render()">${ic("trend")} Trend</button><button class="${S.side === "off" ? "on" : ""}" onclick="S.side='off';render()">List only</button></div>
      <button class="btn btn-p btn-sm" onclick="toast('Opens Add Measure form on this WO')">Add Measure</button></div></div>`;
        if (!w.measures.length)
          return (
            head + '<div class="empty">No measures on this work order.</div>'
          );
        if (S.side === "trend")
          return (
            head +
            `<div class="pair" style="margin-bottom:6px"><span class="sec-t">Measure</span><span class="sec-t">Trend · same measure on this asset, earlier WOs (sample history)</span></div>` +
            w.measures
              .map(
                (m) =>
                  `<div class="pair">${mCard(w, m)}${trendCell(w, m)}</div>`
              )
              .join("")
          );
        if (S.side === "off")
          return head + w.measures.map((m) => mCard(w, m)).join("");
        return (
          head +
          `<div class="split"><div>${w.measures.map((m) => mCard(w, m)).join("")}</div>${docView(docs, w)}</div>`
        );
      }
      function docView(docs, w) {
        if (!docs.length)
          return `<div class="side"><div class="empty">No PDF on this WO or the workpack.</div></div>`;
        const d0 = docs[0],
          tools = [
            ["pen", "✏️"],
            ["hl", "🖍"],
            ["txt", "T"],
            ["move", "✋"]
          ];
        const rowsOnPage = w.measures.filter((m) => m.pg === S.pg);
        return `<div class="side">
    <div class="side-h"><select>${docs.map((d) => `<option>${d.title}${d.wo !== w.num ? " (workpack)" : ""}</option>`).join("")}</select>
      ${tools.map(([k, i]) => `<button class="tool ${S.tool === k ? "on" : ""}" onclick="S.tool='${k}';render()">${i}</button>`).join("")}</div>
    <div class="side-h" style="background:var(--s1)"><div class="pager"><button class="tool" onclick="S.pg=Math.max(1,S.pg-1);S.docRow=null;render()">‹</button>Page ${S.pg} of ${d0.pages}<button class="tool" onclick="S.pg=Math.min(${d0.pages},S.pg+1);S.docRow=null;render()">›</button></div></div>
    <div class="page-wrap"><div class="page">
      <h5>${D.key === "HT" ? "PRT Workpack — MEL-SEED Haul Truck HT-02" : "Wagon PM01 inspection — WG 20213"}</h5>
      <div class="sub">Page ${S.pg} of ${d0.pages} · ${esc(w.subject)}</div>
      ${
        rowsOnPage.length
          ? `<table><tr><th style="width:42%">Check</th><th>Spec</th><th>Reading</th><th>OK / NOK</th></tr>
        ${rowsOnPage.map((m) => `<tr class="${S.docRow === m.id ? "hl" : ""}"><td>${esc(m.comp)}</td><td>${m.vt === "Temperature" ? "≤ 70 °C" : m.vt === "Depth" ? "≥ 14 mm" : "—"}</td><td>${m.val ?? ""} ${m.val != null ? unit(m.vt) : ""}</td><td>${m.out === "OK" ? "✓" : isF(m) ? "✗" : ""}</td></tr>`).join("")}
      </table>`
          : '<p style="color:#666">General instructions, isolation procedure and safety notes.</p>'
      }
      <table><tr><th>Remarks</th></tr><tr><td style="height:70px"></td></tr></table>
      <table><tr><th style="width:50%">Maintainer</th><th>Supervisor</th></tr><tr><td style="height:46px"></td><td></td></tr></table>
      <svg class="ink" style="left:58%;top:88px;width:150px;height:60px" viewBox="0 0 150 60"><path d="M5 40 C 30 5, 60 55, 90 20 S 140 30, 145 10" stroke="#E84B4B" stroke-width="2.5" fill="none"/></svg>
    </div></div>
    <div class="side-f"><span>c-pdf-annotator · ${d0.pages} pages</span><button class="btn btn-b btn-sm" onclick="toast('Saves annotated copy to the WO (uploadAnnotatedPdf)')">Save annotations</button></div></div>`;
      }

      /* ── Execute / Parts / Notes / Raised ── */
      function executeView(w) {
        /* same markup + behaviour as workOrderDetail "Work Plans" (plan-card / step-row, handleStepClick) */
        const head = `<div class="ph"><h2>${ic("execute")} Work Plans</h2><span class="hint">Existing workOrderDetail Work Plans panel</span></div>`;
        if (!w.plans.length)
          return (
            head +
            `<p class="no-plans">No work plans linked to this work order.</p>`
          );
        return (
          head +
          `<div class="plan-list">${w.plans
            .map((p, pi) => {
              const key = w.num + "_" + pi,
                open = !!S.exp[key];
              return `<div class="plan-card"><button class="plan-toggle ${open ? "expanded" : ""}" onclick="S.exp['${key}']=!S.exp['${key}'];render()" aria-expanded="${open}">
        <span class="plan-order">${pi + 1}</span><span class="plan-name">${p.n}</span><span class="plan-chevron">${open ? "▾" : "›"}</span></button>
      ${
        open
          ? `<div class="step-list">${p.steps
              .map((st, i) => {
                const status = st.d ? "Completed" : "New";
                return `<button class="step-row status-${status.toLowerCase()} ${st.flow ? "has-action" : ""}" onclick="stepClick('${w.num}',${pi},${i})">
          <span class="step-num">${i + 1}</span><div class="step-body"><span class="step-name">${st.n}</span></div>
          <span class="step-status">${status}</span>${st.flow ? '<span class="step-action-icon">▶</span>' : ""}</button>`;
              })
              .join("")}
        ${p.steps.length ? "" : '<p class="no-steps">No steps defined.</p>'}</div>`
          : ""
      }</div>`;
            })
            .join("")}</div>`
        );
      }
      function partsView(w) {
        /* same markup + behaviour as assetReview "Required Parts" (parts-table, + Consume, + Add part) */
        const head = `<div class="ph"><h2>${ic("parts")} Parts</h2><span class="hint">Existing assetReview Parts panel · ProductRequired vs ProductConsumed on ${w.num}</span></div>`;
        const tbl = w.parts.length
          ? `<div class="parts-table"><div class="parts-head"><span class="parts-col-name">Part</span><span class="parts-col-num">Consumed</span><span class="parts-col-num">Required</span><span class="parts-col-num">Cost</span><span class="parts-col-act"></span></div>
      ${w.parts
        .map(
          (
            p,
            i
          ) => `<div class="parts-row"><span class="parts-col-name">${p.n}</span><span class="parts-col-num">${p.used}</span><span class="parts-col-num">${p.req}</span><span class="parts-col-num">$${p.cost}</span>
        <span class="parts-col-act">${p.used < p.req ? `<button class="ar-consume-btn" onclick="consume('${w.num}',${i})">+ Consume</button>` : ""}</span></div>`
        )
        .join("")}</div>`
          : `<div class="ar-empty"><span class="ar-empty-icon">📦</span><p>No parts recorded for this asset.</p></div>`;
        return (
          head +
          tbl +
          `<div class="ar-addpart"><button class="ar-addpart-toggle" onclick="S.addPart=!S.addPart;render()">+ Add part</button>
    ${S.addPart ? `<div class="ar-addpart-row"><select id="newPart"><option value="">Select a part…</option><option>Hydraulic oil 20L</option><option>Filter</option><option>Rag pack</option><option>Seal kit — HP</option></select><button class="ar-consume-btn" onclick="addPart('${w.num}')">Add</button></div>` : ""}</div>`
        );
      }
      function notesView(w) {
        return `<div class="ph"><h2>${ic("notes")} Notes &amp; codes</h2><span class="hint">Same data as Notes &amp; Codes in workOrderDetail</span></div>
    <div class="nh">${w.notes.length ? w.notes.map((n) => `<div class="note"><div class="w">${n.w}</div>${esc(n.t)}</div>`).join("") : '<div class="note" style="color:var(--dim)">No notes yet.</div>'}</div>
    <div class="f"><label>Add note</label><textarea id="noteIn" rows="3" placeholder="What did you find / do?"></textarea></div>
    <div class="f3"><div class="f"><label>Cause code</label><select><option>— Select —</option><option>0010, Wear and Tear</option></select></div>
      <div class="f"><label>Delay code</label><select><option>— Select —</option></select></div><div class="f"><label>Damage code</label><select><option>— Select —</option></select></div></div>
    <div style="display:flex;justify-content:flex-end"><button class="btn btn-b" onclick="addNote('${w.num}')">Save note &amp; codes</button></div>`;
      }
      function raisedView(w) {
        const a = asset(w.assetId),
          list = raisedOn(w.assetId).sort((x, y) =>
            y.date.localeCompare(x.date)
          );
        return `<div class="ph"><h2>${ic("raised")} Raised tasks</h2><span class="hint">Extra work raised by technicians on ${short(a.name)} and its sub-assets · all workpacks</span>
      <div class="right"><button class="btn btn-p btn-sm" onclick="openRaise('${w.assetId}')">${ic("raised")} Raise Task</button></div></div>
    ${
      list.length
        ? `<table class="rtl"><tr><th>Date</th><th>WO</th><th>Subject</th><th>Asset</th><th>Work type</th><th>Workpack</th><th>Status</th></tr>
      ${list
        .map((r) => {
          const here = !!wo(r.num);
          return `<tr class="${here ? "click" : ""}" ${here ? `onclick="selWo('${r.num}')"` : ""}><td>${r.date}</td><td><b>${r.num}</b></td><td>${esc(r.subject)}</td><td>${short(asset(r.assetId).name)}</td><td><span class="tag wt">${r.wt}</span></td><td>${r.wp}${r.wp === D.wp ? " (this)" : ""}</td><td><span class="pill ${r.status === "In Progress" ? "ip" : r.status === "Completed" ? "cpl" : ""}">${r.status}</span></td></tr>`;
        })
        .join("")}</table>`
        : `<div class="empty">No raised tasks on ${short(a.name)} yet.</div>`
    }`;
      }

      /* ───────────── actions ───────────── */
      function pick(id) {
        S.sel = id;
        S.focus = kids(id).length ? id : asset(id).parent || id;
        const ids = S.inclSub ? desc(id) : [id],
          cur = wo(S.wo);
        if (!asset(id).parent) S.wo = D.wos[0].num;
        else if (!ids.includes(cur.assetId)) {
          const f = D.wos.find((w) => !w.isWp && ids.includes(w.assetId));
          S.wo = f ? f.num : D.wos[0].num;
        }
        S.hl = wo(S.wo).assetId;
        S.open = null;
        S.docRow = null;
        render();
      }
      function zoom(id) {
        S.focus = id;
        S.sel = id;
        render();
      }
      function selWo(num) {
        S.wo = num;
        S.open = null;
        S.docRow = null;
        const w = wo(num),
          d = woD(w);
        S.hl = w.assetId;
        if (!desc(S.focus).includes(w.assetId)) S.focus = D.assets[0].id;
        S.tab =
          d.pend.length ||
          d.bare.length ||
          (!w.plans.length && w.measures.length)
            ? "measure"
            : w.plans.length
              ? "execute"
              : "notes";
        render();
      }
      function setTab(t) {
        S.tab = t;
        render();
      }
      function showInDoc(mid, pg) {
        S.side = "doc";
        S.pg = pg;
        S.docRow = mid;
        render();
      }
      const nowStamp = () =>
        new Date().toLocaleString("en-AU", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      function setOut(num, mid, o) {
        autoClock();
        const m = wo(num).measures.find((x) => x.id === mid);
        m.out = o;
        m.at = nowStamp();
        if (isF(m) && !m.comments.trim()) S.open = mid;
        render();
      }
      function setVal(num, mid, v) {
        autoClock();
        const m = wo(num).measures.find((x) => x.id === mid);
        m.val = v === "" ? null : Number(v);
        m.at = nowStamp();
        if (!m.out) m.out = "Measure";
        render();
      }
      function saveMeta(num, mid) {
        autoClock();
        const m = wo(num).measures.find((x) => x.id === mid);
        m.comments = document.getElementById("mc_" + mid).value;
        m.review = document.getElementById("mr_" + mid).value;
        m.loc = document.getElementById("ml_" + mid).value;
        S.open = null;
        render();
        toast(
          m.out === "Attention Required" && m.comments
            ? "Saved. Notification Case flow fires on Attention + comment"
            : "Measure updated"
        );
      }
      function stepClick(num, pi, i) {
        autoClock();
        const w = wo(num),
          s = w.plans[pi].steps[i];
        if (s.flow)
          toast(
            "In Progress, then launches flow " +
              s.flow +
              ". Completed on finish, New if cancelled"
          );
        s.d = true;
        const st = w.plans.filter((p) => !p.exception).flatMap((p) => p.steps);
        w.status = st.every((x) => x.d) ? "Completed" : "In Progress";
        render();
      }
      function consume(num, i) {
        autoClock();
        const p = wo(num).parts[i];
        p.used = Math.min(p.req, p.used + 1);
        render();
      }
      function addPart(num) {
        const n = document.getElementById("newPart").value,
          q = 1;
        S.addPart = false;
        if (!n) return toast("Pick a part");
        autoClock();
        wo(num).parts.push(P(n, q, q, 20));
        render();
        toast(`${q} × ${n} consumed`);
      }
      function addNote(num) {
        const t = document.getElementById("noteIn").value.trim();
        if (!t) return toast("Type a note");
        autoClock();
        wo(num).notes.push({ w: "J. Smith · now", t });
        render();
        toast("Note saved");
      }

      function openRaise(aid) {
        aid = aid || S.sel;
        const opts = D.assets
          .map(
            (a) =>
              `<option value="${a.id}" ${a.id === aid ? "selected" : ""}>${"— ".repeat(depthOf(a.id))}${esc(a.name)}</option>`
          )
          .join("");
        openDrawer(`<h3>${ic("raised")} Raise Task<button class="x" onclick="closeAll()">✕</button></h3>
    <div class="sub">Additional work found by the technician. Creates a work order on the asset under workpack ${D.wp}.</div>
    <div class="info">🏷 Marked as <b>Raised Task</b>. Appears in the Raised tasks tab for this asset.</div>
    <div class="f"><label>Asset</label><select id="rAsset">${opts}</select></div>
    <div class="f"><label>Work type · ${WORK_TYPES.length} in org</label><input id="rWtQ" placeholder="Search work types…" oninput="filterWt(this.value)"><select id="rWt" size="6" style="min-height:180px">${WORK_TYPES.map((t) => `<option>${t}</option>`).join("")}</select></div>
    <div class="f"><label>Subject</label><input id="rSubj" placeholder="Short description of the work"></div>
    <div class="f"><label>Description</label><textarea rows="3" id="rDesc"></textarea></div>
    <div class="f2"><div class="f"><label>Priority</label><select id="rPri"><option>Medium</option><option>Low</option><option>High</option><option>Critical</option></select></div>
      <div class="f"><label>Cause code</label><select><option>— Select —</option><option>0010, Wear and Tear</option></select></div></div>
    <div class="f"><label>Photo</label><button class="btn btn-g" style="text-align:left" onclick="toast('Camera / attach image')">📷 Take photo / attach</button></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeAll()">Cancel</button><button class="btn btn-p" onclick="saveRaise()">Create task</button></div>`);
      }
      function filterWt(q) {
        q = q.toLowerCase();
        put(
          document.getElementById("rWt"),
          WORK_TYPES.filter((t) => t.toLowerCase().includes(q))
            .map((t) => `<option>${t}</option>`)
            .join("")
        );
      }
      function saveRaise() {
        const aid = document.getElementById("rAsset").value,
          wt = document.getElementById("rWt").value,
          subj = document.getElementById("rSubj").value.trim();
        if (!wt) return toast("Pick a work type");
        if (!subj) return toast("Enter a subject");
        autoClock();
        const num = "000" + (13000 + ++seq),
          d0 = document.getElementById("rDesc").value.trim();
        D.wos.push({
          num,
          subject: subj,
          wt,
          assetId: aid,
          status: "New",
          raised: true,
          Priority: document.getElementById("rPri").value,
          measures: [],
          plans: [],
          parts: [],
          notes: d0 ? [{ w: "J. Smith · now", t: d0 }] : []
        });
        S.sel = aid;
        S.focus = kids(aid).length ? aid : asset(aid).parent || aid;
        S.wo = num;
        S.tab = "raised";
        closeAll();
        render();
        toast(`Raised task ${num} created on ${short(asset(aid).name)}`);
      }

      function openAssetDrawer() {
        const a = asset(S.sel),
          fields = ASSET_FIELDS.filter(([f]) => CFG.assetDrawer[f]);
        openDrawer(`<h3>ⓘ ${esc(a.name)}<button class="x" onclick="closeAll()">✕</button></h3>
    <div class="sub">Fields and edit rights from Kiosk Config</div>
    ${fields
      .map(([f, l]) =>
        CFG.assetDrawer[f] === "E"
          ? `<div class="f"><label>${l} <span class="tag">edit</span></label><input value="${esc(fv(a, f) === "—" ? "" : fv(a, f))}"></div>`
          : `<div class="f"><label>${l}</label><div class="ro">${esc(fv(a, f))}</div></div>`
      )
      .join("")}
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeAll()">Close</button>${fields.some(([f]) => CFG.assetDrawer[f] === "E") ? `<button class="btn btn-b" onclick="closeAll();toast('Asset saved')">Save</button>` : ""}</div>`);
      }

      /* ── Kiosk Config page (sidebar nav item, like Time Tracking) ── */
      function configPage() {
        const listSec = (
          key,
          title,
          sub,
          cat
        ) => `<div class="card cfg-sec"><h4>${title}</h4><div class="sub">${sub}</div>
    ${cat
      .map(([f, l]) => {
        const on = CFG[key].includes(f),
          i = CFG[key].indexOf(f);
        return `<div class="cfg-row"><button class="cb ${on ? "on" : ""}" onclick="cfgTog('${key}','${f}')">${on ? "✓" : ""}</button><span>${l}<code>${f}</code></span>
        <span>${on ? `<button class="mv" onclick="cfgMove('${key}','${f}',-1)">▲</button><button class="mv" onclick="cfgMove('${key}','${f}',1)">▼</button><span class="mv">#${i + 1}</span>` : ""}</span></div>`;
      })
      .join("")}</div>`;
        const a = D.assets[0],
          w = D.wos[0];
        return `<div class="cfg-wrap">
    <h1>🛠 Kiosk Config</h1>
    <div class="sub">Org-wide: applies to every kiosk. Supervisor/admin only. Store: custom object <code style="color:var(--warn)">Kiosk_App_Config__c</code> (Surface · Object · Field · Order · Editable, plus feature settings). Planned, not built.</div>
    <div class="cfg-grid">
      <div>
        ${listSec(
          "assetTile",
          "Asset title tile",
          "Fields next to the selected asset name on Asset Review",
          ASSET_FIELDS.filter((x) => x[0] !== "Name")
        )}
        <div class="card cfg-sec"><h4>Preview</h4><div class="preview"><div class="sec-t">Selected asset</div><b>${esc(a.name)}</b><div class="kvs" style="margin-top:8px">${CFG.assetTile.map((f) => `<div class="kv"><span class="k">${ASSET_FIELDS.find((x) => x[0] === f)[1]}</span><span class="v">${esc(fv(a, f))}</span></div>`).join("")}</div></div></div>
      </div>
      <div class="card cfg-sec"><h4>Asset drawer</h4><div class="sub">Fields in ⓘ Asset details, and whether the kiosk can edit them</div>
        ${ASSET_FIELDS.map(([f, l]) => {
          const m = CFG.assetDrawer[f] || "";
          return `<div class="cfg-row"><button class="cb ${m ? "on" : ""}" onclick="cfgDrawer('${f}','${m ? "" : "R"}')">${m ? "✓" : ""}</button><span>${l}<code>${f}</code></span>
            <span>${m ? `<span class="mini"><button class="${m === "R" ? "on" : ""}" onclick="cfgDrawer('${f}','R')">Read</button><button class="${m === "E" ? "on" : ""}" onclick="cfgDrawer('${f}','E')">Edit</button></span>` : ""}</span></div>`;
        }).join("")}</div>
      <div>
        ${listSec(
          "woTile",
          "Work order title tile",
          "Fields under the WO number in the workspace header",
          WO_FIELDS.filter((x) => x[0] !== "WorkOrderNumber")
        )}
      </div>
      <div class="card cfg-sec"><h4>Preview</h4><div class="preview"><b>${w.num} · ${esc(w.subject)}</b><div class="kvs" style="margin-top:8px">${CFG.woTile.map((f) => `<div class="kv"><span class="k">${WO_FIELDS.find((x) => x[0] === f)[1]}</span><span class="v">${esc(fv(w, f, true))}</span></div>`).join("")}</div></div></div>
      <div class="card cfg-sec" style="grid-column:1 / -1"><h4>${ic("filter")} Work type focus filter</h4><div class="sub">Show the multi-select work-type filter above the asset map. Types are the WorkTypes of WOs under the workpack (root WO).</div>
        <div class="cfg-row"><button class="cb ${CFG.wtFilter ? "on" : ""}" onclick="CFG.wtFilter=!CFG.wtFilter;S.wtf=[];render()">${CFG.wtFilter ? "✓" : ""}</button><span>Enable work type filter<code>Feature setting · Work_Type_Filter</code></span><span></span></div></div>
    </div></div>`;
      }
      function cfgTog(key, f) {
        const a = CFG[key],
          i = a.indexOf(f);
        if (i >= 0) a.splice(i, 1);
        else a.push(f);
        render();
      }
      function cfgMove(key, f, dlt) {
        const a = CFG[key],
          i = a.indexOf(f),
          j = i + dlt;
        if (j < 0 || j >= a.length) return;
        [a[i], a[j]] = [a[j], a[i]];
        render();
      }
      function cfgDrawer(f, m) {
        if (m) CFG.assetDrawer[f] = m;
        else delete CFG.assetDrawer[f];
        render();
      }

      /* ── design notes ── */
      function openNotes() {
        put(
          document.getElementById("dn"),
          `<h3>Design notes · v5 <button onclick="closeAll()">✕</button></h3>
  <h4>Changes from v4</h4><ul>
    <li><b>One icon set</b>: Measure, Execute, Parts, Notes and Raise Task all use matching line icons, on the tabs, panel headings and Raise Task buttons.</li>
    <li><b>Shaded bands</b> for the asset tile, the WO title, the next step and every panel heading.</li>
    <li><b>Measure rows</b>: measure type hidden. <b>Captured</b> date/time shown, from <code>Update_Date__c</code> (already returned as <code>updateDate</code> by KioskController) and set on every outcome or value change. "Comments, notes, location" is now <b>Edit</b>.</li>
    <li><b>Execute</b> is the existing <code>workOrderDetail</code> Work Plans panel: plan-card + step-row, same CSS, New/In Progress/Completed, ▶ for flow steps. Tapping a step = <code>handleStepClick</code>.</li>
    <li><b>Parts</b> is the existing <code>assetReview</code> Required Parts table: Part · Consumed · Required · Cost · + Consume, plus "+ Add part".</li>
    <li><b>Work type focus</b> (optional, Kiosk Config): chips list the distinct WorkType names of WOs under the workpack (<code>RootWorkOrderId</code> = workpack). Multi-select filters the WO list, map status colours, open-WO counts and progress. None selected = all. Proposed: keep the selection per worker session.</li>
    <li><b>Map highlight</b>: selecting a WO outlines its asset on the map in blue (zooms out if it's off-screen). The asset you tapped stays orange.</li></ul>
  <h4>Decided</h4><ul>
    <li>Raised marker = new checkbox <code>WorkOrder.Raised_Task__c</code>.</li>
    <li>New fields <code>Measure_Point__c.Source_Document__c</code> + <code>Page_Number__c</code>.</li>
    <li>Measure save writes both <code>Work_Order__c</code> (selected WO) and <code>Asset__c</code>. No seed fix.</li></ul>
  <h4>Also</h4><ul>
    <li>Config store = custom object <code>Kiosk_App_Config__c</code> (the kiosk page can save it; custom metadata it can't).</li>
    <li>History, values, parts, territory and crew names are sample data.</li></ul>`
        );
        openL("dn");
      }

      function openDrawer(html) {
        put(document.getElementById("drawer"), html);
        openL("drawer");
      }
      function openL(id) {
        document.getElementById("scrim").classList.add("open");
        document.getElementById(id).classList.add("open");
      }
      function closeAll() {
        ["scrim", "drawer", "dn"].forEach((i) =>
          document.getElementById(i).classList.remove("open")
        );
      }
      function toast(t) {
        const el = document.getElementById("toast");
        el.textContent = t;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 2600);
      }

      loadDs("HT");
    </script>
  </body>
</html>
