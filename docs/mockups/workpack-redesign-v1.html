<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workpack v1 — root work order page redesign</title>
    <style>
      :root {
        --bg: #0b0f14;
        --s1: #131a22;
        --s2: #1b2530;
        --s3: #243040;
        --bd: #2a3744;
        --tx: #f2f5f7;
        --mu: #a6b2bd;
        --dim: #6b7a89;
        --ac: #e25822;
        --ach: #f06a2a;
        --ac2: #2e8fe6;
        --ok: #21c07a;
        --warn: #f2b441;
        --bad: #e84b4b;
        --vio: #9b7bea;
        --r: 14px;
        --rs: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.4 -apple-system,
          "SF Pro Text",
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      .card {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: var(--r);
      }
      .chip {
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--s3);
        color: var(--mu);
        font-size: 13px;
        white-space: nowrap;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .s-grey {
        background: var(--dim);
      }
      .s-amber {
        background: var(--warn);
      }
      .s-red {
        background: var(--bad);
      }
      .s-green {
        background: var(--ok);
      }
      .btn {
        min-height: 48px;
        padding: 0 18px;
        border-radius: var(--rs);
        font-weight: 600;
        white-space: nowrap;
      }
      .btn-sm {
        min-height: 40px;
        padding: 0 14px;
        font-size: 14px;
      }
      .btn-p {
        background: var(--ac);
        color: #fff;
      }
      .btn-p:hover {
        background: var(--ach);
      }
      .btn-g {
        background: var(--s2);
        border: 1px solid var(--bd);
        color: var(--mu);
      }
      .btn-b {
        background: var(--ac2);
        color: #fff;
      }
      .sec-t {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .tag {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--s3);
        color: var(--mu);
        white-space: nowrap;
      }
      .tag.wt {
        background: rgba(46, 143, 230, 0.16);
        color: var(--ac2);
      }
      .tag.bad {
        background: rgba(232, 75, 75, 0.18);
        color: var(--bad);
      }
      .tag.warn {
        background: rgba(242, 180, 65, 0.18);
        color: var(--warn);
      }
      .tag.rt {
        background: rgba(155, 123, 234, 0.2);
        color: var(--vio);
        font-weight: 700;
      }
      .tag.asset {
        background: transparent;
        border: 1px solid var(--bd);
      }
      button.tag {
        cursor: pointer;
      }
      .pill {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: var(--s3);
        color: var(--mu);
      }
      .pill.ip {
        background: rgba(242, 180, 65, 0.2);
        color: var(--warn);
      }
      .pill.cpl {
        background: rgba(33, 192, 122, 0.2);
        color: var(--ok);
      }

      /* ── kiosk shell (mirrors kioskSidebar + kioskHeader) ── */
      .app {
        display: grid;
        grid-template-columns: 230px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: var(--s1);
        border-right: 1px solid var(--bd);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 8px 16px;
      }
      .logo .i {
        font-size: 26px;
      }
      .logo .t {
        font-weight: 800;
      }
      .logo .s {
        font-size: 12px;
        color: var(--dim);
      }
      .sup {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 10px;
        background: var(--s2);
        margin-bottom: 14px;
        font-size: 13px;
      }
      .sup .l {
        color: var(--dim);
        font-size: 11px;
      }
      .nav {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 10px;
        color: var(--mu);
        font-weight: 600;
        text-align: left;
        margin-bottom: 4px;
        min-height: 48px;
      }
      .nav:hover {
        background: var(--s2);
      }
      .nav.on {
        background: rgba(226, 88, 34, 0.14);
        color: var(--tx);
        box-shadow: inset 3px 0 0 var(--ac);
      }
      .nav .new {
        margin-left: auto;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(155, 123, 234, 0.2);
        color: var(--vio);
      }
      .sb-foot {
        margin-top: auto;
        border-top: 1px solid var(--bd);
        padding-top: 10px;
      }
      .sb-foot .nav {
        font-weight: 500;
      }
      .sb-foot .danger {
        color: var(--bad);
      }
      .ver {
        font-size: 11px;
        color: var(--dim);
        padding: 0 12px 6px;
      }
      .khdr {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 24px;
        background: var(--s1);
        border-bottom: 1px solid var(--bd);
        position: sticky;
        top: 0;
        z-index: 7;
      }
      .khdr .terr {
        font-weight: 700;
      }
      .khdr .crew {
        color: var(--mu);
        font-size: 14px;
      }
      .khdr .time {
        margin: 0 auto;
        font-variant-numeric: tabular-nums;
        color: var(--mu);
        font-weight: 600;
      }
      .worker {
        display: flex;
        align-items: center;
        gap: 0;
        border-radius: 999px;
        background: var(--s2);
        border: 1px solid var(--bd);
        overflow: hidden;
      }
      .worker .who {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        min-height: 44px;
        font-weight: 600;
      }
      .worker .who i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ok);
      }
      .clockb {
        min-height: 44px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        border-left: 1px solid var(--bd);
        color: var(--mu);
      }
      .clockb.on {
        background: rgba(33, 192, 122, 0.16);
        color: var(--ok);
      }
      .clockb .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--dim);
      }
      .clockb.on .pulse {
        background: var(--ok);
        animation: pl 1.6s infinite;
      }
      @keyframes pl {
        0% {
          box-shadow: 0 0 0 0 rgba(33, 192, 122, 0.6);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(33, 192, 122, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(33, 192, 122, 0);
        }
      }
      .main {
        min-width: 0;
      }

      /* page bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--bd);
        background: var(--bg);
        position: sticky;
        top: 65px;
        z-index: 6;
      }
      .back {
        min-height: 44px;
        padding: 0 16px;
        border-radius: var(--rs);
        background: var(--s2);
        border: 1px solid var(--bd);
        color: var(--mu);
      }
      .tb-title {
        font-size: 21px;
        font-weight: 700;
      }
      .tb-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--mu);
        font-size: 14px;
      }
      .bar {
        width: 120px;
        height: 8px;
        border-radius: 4px;
        background: var(--s3);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .ds {
        display: flex;
        border: 1px solid var(--bd);
        border-radius: var(--rs);
        overflow: hidden;
      }
      .ds button {
        padding: 8px 12px;
        font-size: 13px;
        color: var(--mu);
      }
      .ds button.on {
        background: var(--ac2);
        color: #fff;
      }
      .dashed {
        min-height: 38px;
        padding: 0 12px;
        border-radius: var(--rs);
        border: 1px dashed var(--ac2);
        color: var(--ac2);
        font-size: 13px;
      }

      .wrap {
        padding: 16px 24px 40px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .atile {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
      }
      .atile h2 {
        margin: 0;
        font-size: 20px;
      }
      .kv {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .kv .k {
        font-size: 11px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .kv .v {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kvs {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
      }
      .atile .right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex: none;
      }

      .map {
        padding: 12px 16px 14px;
      }
      .map-h {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .crumb {
        padding: 6px 10px;
        border-radius: 8px;
        color: var(--mu);
        font-size: 14px;
      }
      .crumb:hover {
        background: var(--s2);
      }
      .crumb.cur {
        color: var(--tx);
        font-weight: 700;
      }
      .crumb-sep {
        color: var(--dim);
      }
      .map-h .right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: flex;
        border: 1px solid var(--bd);
        border-radius: var(--rs);
        overflow: hidden;
      }
      .seg button {
        padding: 8px 14px;
        font-size: 14px;
        color: var(--mu);
        min-height: 40px;
      }
      .seg button.on {
        background: var(--ac2);
        color: #fff;
        font-weight: 600;
      }
      .ice {
        position: relative;
      }
      .ice-row-l {
        position: absolute;
        left: 0;
        width: 30px;
        font-size: 11px;
        color: var(--dim);
        display: flex;
        align-items: center;
      }
      .blk {
        position: absolute;
        border-radius: 8px;
        padding: 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        text-align: left;
        background: var(--s2);
        border: 1px solid var(--bd);
        font-size: 14px;
      }
      .blk:hover {
        border-color: var(--mu);
      }
      .blk.sel {
        border: 2px solid var(--ac);
        background: rgba(226, 88, 34, 0.14);
      }
      .blk.path {
        background: var(--s3);
      }
      .blk .bn {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .bc {
        font-size: 12px;
        padding: 1px 7px;
        border-radius: 999px;
        background: rgba(46, 143, 230, 0.22);
        color: var(--ac2);
        font-weight: 700;
      }
      .blk.st-red {
        box-shadow: inset 4px 0 0 var(--bad);
      }
      .blk.st-amber {
        box-shadow: inset 4px 0 0 var(--warn);
      }
      .blk.st-green {
        box-shadow: inset 4px 0 0 var(--ok);
      }
      .blk.st-grey {
        box-shadow: inset 4px 0 0 var(--dim);
      }
      .blk .zoom {
        font-size: 12px;
        color: var(--dim);
      }
      .schem {
        position: relative;
      }
      .schem img {
        width: 100%;
        display: block;
        border-radius: 8px;
        opacity: 0.85;
      }
      .schem .zone {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 8px;
        border: 2px solid transparent;
        display: flex;
        justify-content: center;
        padding-top: 6px;
      }
      .schem .zone.sel {
        border-color: var(--ac);
        background: rgba(226, 88, 34, 0.12);
      }
      .legend {
        display: flex;
        gap: 14px;
        font-size: 12px;
        color: var(--mu);
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .body {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 16px;
        align-items: start;
        transition: grid-template-columns 0.25s ease;
      }
      .body.wc {
        grid-template-columns: 68px 1fr;
      }
      .wol {
        padding: 12px;
        position: sticky;
        top: 140px;
        max-height: calc(100vh - 156px);
        overflow: auto;
      }
      .wol-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 10px;
      }
      .wol-h .t {
        font-weight: 700;
        font-size: 17px;
        flex: 1;
      }
      .tog {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--mu);
        padding: 0 4px 10px;
      }
      .sw {
        width: 40px;
        height: 24px;
        border-radius: 12px;
        background: var(--s3);
        position: relative;
        flex: none;
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--mu);
        transition: left 0.2s;
      }
      .sw.on {
        background: var(--ac2);
      }
      .sw.on::after {
        left: 19px;
        background: #fff;
      }
      .grp {
        font-size: 12px;
        color: var(--dim);
        padding: 10px 6px 6px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .woc {
        width: 100%;
        text-align: left;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 10px;
        padding: 12px;
        border-radius: 12px;
        background: var(--s2);
        border: 1px solid transparent;
        margin-bottom: 8px;
      }
      .woc:hover {
        border-color: var(--bd);
      }
      .woc.sel {
        border-color: var(--ac);
        background: rgba(226, 88, 34, 0.08);
      }
      .woc .n {
        font-weight: 700;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .woc .sj {
        grid-column: 1 / 2;
        color: var(--mu);
        font-size: 14px;
      }
      .woc .meta {
        grid-column: 1 / -1;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .woc .ring {
        grid-row: 1 / 3;
        grid-column: 2;
      }
      .ring {
        width: 42px;
        height: 42px;
      }

      .ws {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .ws-h {
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ws-h .top {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .ws-h h1 {
        margin: 0;
        font-size: 21px;
        flex: 1;
      }
      .next {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        border-left: 6px solid var(--ac);
        background: linear-gradient(
          90deg,
          rgba(226, 88, 34, 0.14),
          var(--s1) 60%
        );
      }
      .next.ok {
        border-left-color: var(--ok);
        background: linear-gradient(
          90deg,
          rgba(33, 192, 122, 0.14),
          var(--s1) 60%
        );
      }
      .next.warn {
        border-left-color: var(--warn);
        background: linear-gradient(
          90deg,
          rgba(242, 180, 65, 0.14),
          var(--s1) 60%
        );
      }
      .next .txt {
        font-size: 19px;
        font-weight: 600;
      }
      .next .btn {
        margin-left: auto;
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        overflow: hidden;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        min-height: 66px;
        text-align: left;
        border-right: 1px solid var(--bd);
      }
      .tab:last-child {
        border-right: none;
      }
      .tab.on {
        background: var(--s2);
        box-shadow: inset 0 -3px 0 var(--ac);
      }
      .tab .ic {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: var(--s3);
        color: var(--mu);
        flex: none;
        font-size: 15px;
      }
      .tab.done .ic {
        background: var(--ok);
        color: #05210f;
      }
      .tab.warn .ic,
      .tab.prog .ic {
        background: var(--warn);
        color: #2b1d00;
      }
      .tab .t {
        font-weight: 700;
      }
      .tab .d {
        font-size: 12px;
        color: var(--mu);
      }
      .panel {
        padding: 16px 18px;
      }
      .ph {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .ph h2 {
        margin: 0;
        font-size: 18px;
      }
      .ph .hint {
        color: var(--dim);
        font-size: 13px;
      }
      .ph .right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* measures */
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 8px;
        align-items: stretch;
      }
      .pair .mrow {
        margin-bottom: 0;
        height: 100%;
      }
      .mrow {
        display: grid;
        grid-template-columns: 1fr 96px;
        gap: 8px 12px;
        align-items: center;
        padding: 12px;
        border-radius: 10px;
        background: var(--s2);
        margin-bottom: 8px;
        border-left: 4px solid var(--s3);
      }
      .mrow.o-ok {
        border-left-color: var(--ok);
      }
      .mrow.o-m {
        border-left-color: var(--ac2);
      }
      .mrow.o-att {
        border-left-color: var(--warn);
      }
      .mrow.o-sc {
        border-left-color: var(--bad);
      }
      .mrow.hl {
        outline: 2px solid var(--ac2);
      }
      .mrow .c {
        font-weight: 600;
      }
      .mrow .l {
        font-size: 13px;
        color: var(--mu);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 4px;
      }
      .mrow .v {
        font-size: 20px;
        font-weight: 700;
        text-align: right;
      }
      .mrow .v small {
        font-size: 12px;
        color: var(--dim);
        font-weight: 400;
        margin-left: 3px;
      }
      .vin {
        width: 96px;
        min-height: 42px;
        border-radius: 8px;
        background: var(--s3);
        border: 1px solid var(--bd);
        color: var(--tx);
        padding: 0 10px;
        font: inherit;
        text-align: right;
      }
      .outs {
        grid-column: 1 / -1;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .out {
        min-height: 40px;
        padding: 0 12px;
        border-radius: 8px;
        background: var(--s3);
        color: var(--mu);
        font-size: 14px;
        font-weight: 600;
        border: 1px solid transparent;
      }
      .out.on.ok {
        background: rgba(33, 192, 122, 0.2);
        border-color: var(--ok);
        color: var(--ok);
      }
      .out.on.att {
        background: rgba(242, 180, 65, 0.2);
        border-color: var(--warn);
        color: var(--warn);
      }
      .out.on.sc {
        background: rgba(232, 75, 75, 0.2);
        border-color: var(--bad);
        color: var(--bad);
      }
      .out.r {
        margin-left: auto;
      }
      .out.sel {
        background: var(--s1);

      const depthOf = (id) => {
        let d = 0,
          a = asset(id);
        while (a.parent) {
          d++;
          a = asset(a.parent);
        }
        return d;
      };
      const pathTo = (id) => {
        const p = [];
        let a = asset(id);
        while (a) {
          p.unshift(a);
          a = a.parent && asset(a.parent);
        }
        return p;
      };
      const desc = (id) => {
        const out = [id];
        kids(id).forEach((k) => out.push(...desc(k.id)));
        return out;
      };
      const leaves = (id) => {
        const k = kids(id);
        return k.length ? k.reduce((s, c) => s + leaves(c.id), 0) : 1;

      function hash(s) {
        let h = 7;
        for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 100000;
        return h;
      }
      const PAST = [
        ["2026-02-11", "00009812"],
        ["2026-04-09", "00010440"],
        ["2026-06-02", "00011207"],
        ["2026-07-21", "00011893"]
      ];
      const BASE = {

      function hist(w, m) {
        const h = hash(w.assetId + m.comp);
        if (NUMERIC.includes(m.vt)) {
          const b = m.val != null ? m.val * (isF(m) ? 0.85 : 1) : BASE[m.vt];
          return PAST.map(([dt, n], i) => ({
            dt,
            n,
            v: +(b * (0.9 + ((h >> i) % 13) / 100)).toFixed(
              m.vt === "Width" ? 2 : 1
            )
          }));
        }
        const outs = ["OK", "OK", "OK", "Attention Required"];
        return PAST.slice(1).map(([dt, n], i) => ({
          dt,
          n,
          out: outs[(h + i) % 4]
        }));
      }

        const pend = w.measures.filter((m) => !m.out),

        const work = w.plans.filter((p) => !p.exception);

        const shortP = w.parts.filter((p) => p.used < p.req);
        let status = "grey";
        const done =
          (st.length ? sd === st.length : true) &&
          !pend.length &&
          !shortP.length &&
          (st.length || w.measures.length || w.parts.length);
        if (w.status === "Completed" || done) status = "green";
        else if (finds.length) status = "red";
        else if (
          w.status === "In Progress" ||
          sd ||
          w.measures.some((m) => m.out)
        )
          status = "amber";
        return { pend, finds, bare, st, sd, short: shortP, status };

          toast(`Auto clocked in on workpack ${D.wp}`);
        }
      }
      function openClock() {
        const others = WORKPACKS.filter(([n]) => n !== CLOCK.wp),
          c = ctxWp();
        openDrawer(`<h3>⏱ Time clock<button class="x" onclick="closeAll()">✕</button></h3>
    <div class="sub">J. Smith · from any page. One open clock per worker, at workpack level.</div>
    ${
      CLOCK.on
        ? `<div class="card" style="padding:16px;margin-bottom:16px;border-color:var(--ok)"><div class="sec-t">Clocked in</div><div class="clk-big">${fmtT(Date.now() - CLOCK.start)}</div>
        <div style="color:var(--mu);margin-bottom:12px">Workpack ${CLOCK.wp} · ${CLOCK.title}</div>
        <button class="btn btn-p" style="width:100%" onclick="CLOCK.on=false;renderClock();closeAll();toast('Clocked out')">Clock out</button></div>
      <div class="sec-t" style="margin-bottom:8px">Switch workpack (clocks out the current one)</div>`
        : `<div class="sec-t" style="margin-bottom:8px">Clock in to</div>`
    }
    ${others.map(([n, t]) => `<button class="wpl ${n === c ? "ctx" : ""}" onclick="toast('${CLOCK.on ? "Switched" : "Clocked in"} to ${n}');clockIn('${n}');closeAll()"><b>${n}</b><span style="flex:1;color:var(--mu)">${t}</span>${n === c ? '<span class="tag wt">this page</span>' : ""}</button>`).join("")}
    <div style="font-size:13px;color:var(--dim);margin-top:10px">${c ? "" : "No workpack on this page: list = assigned / recent workpacks. "}Scan a WO barcode to pick.</div>`);
      }

      /* ───────────── pages ───────────── */
      function renderAR() {
        renderSidebar();
        renderClock();
        const pg = document.getElementById("page");
        if (NAV === "config") return put(pg, configPage());
        if (NAV !== "workorders")
          return put(
            pg,
            `<div class="wrap"><div class="card empty" style="padding:80px">${NAV === "timetracking" ? "⏱ Existing Time Tracking page (timeTrackingDashboard)" : "📊 Existing Dashboard"}. Unchanged.<br><br>Note the clock in the header still works here.</div></div>`
          );
        const ws = vis().filter((w) => !w.isWp),
          done = ws.filter((w) => woD(w).status === "green").length;
        put(
          pg,
          `
    <div class="topbar"><button class="back">‹ Back to Workpack</button><span class="tb-title">${D.title}</span><span class="chip">Workpack ${D.wp}</span>
      <div class="tb-right"><div class="ds"><button class="${D.key === "HT" ? "on" : ""}" onclick="loadDs('HT')">HT-02 · 00012423</button><button class="${D.key === "WG" ? "on" : ""}" onclick="loadDs('WG')">WG 20213 · 00010070</button></div>
        <span>${done}/${ws.length} WOs done</span><div class="bar"><i style="width:${ws.length ? (done / ws.length) * 100 : 0}%"></i></div>
        <button class="dashed" onclick="openNotes()">ⓘ Design notes</button></div></div>
    <div class="wrap">
      ${assetTile()}
      ${wtfHtml()}
      <div class="card map">${mapHtml()}</div>
      <div class="body ${S.wolC ? "wc" : ""}"><aside class="card wol ${S.wolC ? "rail" : ""}">${S.wolC ? railHtml() : listHtml()}</aside><main class="ws">${wsHtml()}</main></div>
    </div>`
        );
      }

      function assetTile() {
        const a = asset(S.sel),
          st = assetStatus(S.sel);
        return `<div class="card atile"><i class="dot s-${st}" style="width:16px;height:16px"></i>
    <div style="min-width:0"><div class="sec-t">Selected asset · L${depthOf(a.id) + 1}</div><h2>${esc(a.name)}</h2></div>
    <div class="kvs" style="margin-left:18px">${CFG.assetTile.map((f) => `<div class="kv"><span class="k">${ASSET_FIELDS.find((x) => x[0] === f)[1]}</span><span class="v">${esc(fv(a, f))}</span></div>`).join("")}</div>
    <div class="right"><button class="btn btn-g btn-sm" onclick="openAssetDrawer()">ⓘ Asset details</button></div></div>`;
      }

      function mapHtml() {
        const path = pathTo(S.focus);
        const crumbs = path
          .map(
            (a, i) =>
              `${i ? '<span class="crumb-sep">›</span>' : ""}<button class="crumb ${a.id === S.focus ? "cur" : ""}" onclick="zoom('${a.id}')">${i === 0 ? "⌂ " : ""}${short(a.name)}</button>`
          )
          .join("");
        const maxD = Math.max(...D.assets.map((a) => depthOf(a.id))) + 1,
          hasSchem = !!D.schematic;
        let body;
        if (S.view === "schematic" && hasSchem) {
          body = `<div class="schem"><img src="${D.schematic}" alt="Schematic" onerror="this.style.display='none'">
      ${Object.entries(D.zones)
        .map(
          ([id, z]) =>
            `<button class="zone ${desc(id).includes(S.sel) ? "sel" : ""} ${id === S.hl ? "wohl" : ""}" style="left:${z.l}%;width:${z.w}%" onclick="pick('${id}')"><i class="dot s-${assetStatus(id)}" style="width:16px;height:16px;box-shadow:0 0 0 2px #0B0F14"></i></button>`
        )
        .join("")}</div>`;
        } else {
          const ROW = 44,
            GAP = 6,
            LBL = 30,
            rows = [];
          const lay = (id, d, x0, w) => {
            rows.push({ id, d, x0, w });
            let x = x0;
            const tot = leaves(id);
            kids(id).forEach((k) => {
              const kw = (w * leaves(k.id)) / tot;
              lay(k.id, d + 1, x, kw);
              x += kw;
            });
          };
          lay(S.focus, 0, 0, 1);
          const nRows = Math.max(...rows.map((r) => r.d)) + 1,
            base = depthOf(S.focus),
            selPath = pathTo(S.sel).map((a) => a.id),
            hlPath = S.hl ? pathTo(S.hl).map((a) => a.id) : [];
          body = `<div class="ice" style="height:${nRows * (ROW + GAP)}px">
      ${Array.from({ length: nRows }, (_, i) => `<div class="ice-row-l" style="top:${i * (ROW + GAP)}px;height:${ROW}px">L${base + i + 1}</div>`).join("")}
      ${rows
        .map((r) => {
          const a = asset(r.id),
            st = assetStatus(r.id),
            oc = openWoCount(r.id),
            hasK = kids(r.id).length;
          return `<button class="blk st-${st} ${r.id === S.sel ? "sel" : ""} ${r.id === S.hl && r.id !== S.sel ? "wohl" : ""} ${(selPath.includes(r.id) || hlPath.includes(r.id)) && r.id !== S.sel && r.id !== S.hl ? "path" : ""}"
          style="top:${r.d * (ROW + GAP)}px;height:${ROW}px;left:calc(${LBL}px + (100% - ${LBL}px) * ${r.x0} + 2px);width:calc((100% - ${LBL}px) * ${r.w} - 4px)"
          title="${esc(a.name)} (${a.type})" onclick="pick('${r.id}')"><i class="dot s-${st}"></i><span class="bn">${short(a.name)}</span>${oc ? `<span class="bc">${oc}</span>` : ""}${hasK && r.d > 0 ? '<span class="zoom">⤢</span>' : ""}</button>`;
        })
        .join("")}
    </div>`;
        }
        return `<div class="map-h"><span class="sec-t">Asset map</span><div class="crumbs">${crumbs}</div>
      <div class="right"><span class="chip">${maxD} levels</span>
      <div class="seg"><button class="${S.view === "map" ? "on" : ""}" onclick="S.view='map';render()">▤ Hierarchy</button>${hasSchem ? `<button class="${S.view === "schematic" ? "on" : ""}" onclick="S.view='schematic';render()">🖼 Schematic</button>` : ""}</div></div></div>
    ${body}
    <div class="legend"><span><i class="dot s-grey"></i>Not started</span><span><i class="dot s-amber"></i>In progress</span><span><i class="dot s-red"></i>Has finding</span><span><i class="dot s-green"></i>Complete</span><span><b class="bc">n</b> open WOs</span><span><i class="dot" style="background:var(--ac)"></i>Selected asset</span><span><i class="dot" style="background:var(--ac2)"></i>Asset of selected WO</span><span>⤢ tap to zoom</span></div>`;
      }

      /* ── smart collapse of the WO list ──
   collapse: Measure tab · Document/Trend · 📄 chip · any PDF control (needs width) — skipped when pinned
   expand:  asset map / breadcrumb · work-type chip · » button                                                */
      function collapseWol(auto) {
        if (auto && (S.pin || S.wolC)) return false;
        S.wolC = true;
        S.autoC = !!auto;
        return true;
      }
      function expandWol() {
        S.wolC = false;
        S.autoC = false;
      }
      const wantsRoom = () => S.tab === "measure" && S.side !== "off";
      function railHtml() {
        const ids = S.inclSub ? desc(S.sel) : [S.sel];
        const list = vis().filter((w) => ids.includes(w.assetId) || w.isWp);
        return `<button class="rail-btn" title="Show work orders" onclick="expandWol();render()">»</button>
    ${S.autoC ? '<div class="rail-hint">auto-<br>hidden</div>' : ""}
    <div class="rail-lbl">Work orders · ${list.filter((w) => !w.isWp).length}</div>
    ${list
      .map(
        (
          w,
          i
        ) => `${i === 1 ? '<div class="rail-sep"></div>' : ""}<button class="rail-wo ${S.wo === w.num ? "sel" : ""}" title="${w.num} · ${esc(w.subject)}" onclick="selWo('${w.num}')">
      <i class="dot s-${woD(w).status}"></i>${w.isWp ? "WP" : w.num.slice(-3)}${w.raised ? '<span class="rt"></span>' : ""}</button>`
      )
      .join("")}
    <button class="rail-btn" style="font-size:16px" title="Raise Task" onclick="openRaise()">${ic("raised")}</button>`;
      }
      function listHtml() {
        const ids = S.inclSub ? desc(S.sel) : [S.sel];
        const list = vis().filter((w) => ids.includes(w.assetId) || w.isWp),
          groups = {};
        list.forEach((w) => {
          const k = w.isWp ? "__wp" : w.assetId;
          (groups[k] = groups[k] || []).push(w);
        });
        const order = ["__wp", ...ids.filter((i) => groups[i])],
          a = asset(S.sel);
        return `<div class="wol-h"><button class="ctl" title="Collapse list" onclick="collapseWol(false)">«</button><span class="t">Work orders</span><button class="ctl ${S.pin ? "on" : ""}" title="${S.pin ? "Pinned open: auto-collapse off" : "Pin open (stop auto-collapse)"}" onclick="S.pin=!S.pin;render();toast(S.pin?'List pinned open':'Auto-collapse on')">📌</button><button class="btn btn-p btn-sm" onclick="openRaise()">${ic("raised")} Raise Task</button></div>${fOn() ? `<div class="tog" style="color:var(--ac2)">${ic("filter")} Focus: ${S.wtf.map(esc).join(", ")}</div>` : ""}
    <div class="tog"><button class="sw ${S.inclSub ? "on" : ""}" onclick="S.inclSub=!S.inclSub;render()"></button>Include sub-assets of <b style="color:var(--tx)">${short(a.name)}</b></div>
    ${order.map((k) => `<div class="grp">${k === "__wp" ? "📦 Workpack" : "⚙ " + short(asset(k).name)}</div>${groups[k].map(woCard).join("")}`).join("")}
    ${list.filter((w) => !w.isWp).length ? "" : `<div class="empty">No work orders on ${short(a.name)}${fOn() ? " for the selected work types" : ""}.</div>`}`;
      }
      function woCard(w) {
        const d = woD(w);
        return `<button class="woc ${S.wo === w.num ? "sel" : ""}" onclick="selWo('${w.num}')">
    <span class="n"><i class="dot s-${d.status}"></i>${w.num}<span class="pill ${w.status === "In Progress" ? "ip" : w.status === "Completed" ? "cpl" : ""}">${w.status}</span>${w.raised ? '<span class="tag rt">RAISED</span>' : ""}</span>
    ${ring(d.sd, d.st.length)}
    <span class="sj">${esc(w.subject)}</span>
    <span class="meta"><span class="tag wt">${w.wt}</span>${d.pend.length ? `<span class="tag">${d.pend.length} to measure</span>` : ""}${d.finds.length ? `<span class="tag bad">${d.finds.length} finding</span>` : ""}${d.short.length ? `<span class="tag warn">${d.short.length} parts</span>` : ""}</span></button>`;
      }
      function ring(done, total) {
        const r = 16,
          C = 2 * Math.PI * r,
          p = total ? done / total : 0;
        return `<svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="none" stroke="#243040" stroke-width="4"/>
    <circle cx="20" cy="20" r="${r}" fill="none" stroke="${p === 1 ? "#21C07A" : "#F2B441"}" stroke-width="4" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" transform="rotate(-90 20 20)" stroke-linecap="round"/>
    <text x="20" y="20" fill="#F2F5F7" font-size="10" text-anchor="middle" dominant-baseline="central">${total ? Math.round(p * 100) + "%" : "—"}</text></svg>`;
      }

      function nextFor(w, d) {
        if (d.pend.length)
          return {
            c: "",
            t: `Record ${d.pend.length} measure${d.pend.length > 1 ? "s" : ""}. Next: ${d.pend[0].comp}`,
            b: "Measure",
            go: `setTab('measure')`
          };
        if (d.bare.length)
          return {
            c: "warn",
            t: `Finding “${d.bare[0].comp}” has no comment. Describe it`,
            b: "Add comment",
            go: `S.open='${d.bare[0].id}';setTab('measure')`
          };
        for (const p of w.plans.filter((p) => !p.exception)) {
          const s = p.steps.find((s) => !s.d);
          if (s)
            return {
              c: "",
              t: `${p.n}: “${s.n}”`,
              b: "Execute",
              go: `S.tab='execute';S.exp['${w.num}_${w.plans.indexOf(p)}']=true;render()`
            };
        }
        if (d.short.length)
          return {
            c: "",
            t: `Consume ${d.short.length} part line${d.short.length > 1 ? "s" : ""} (${d.short[0].n})`,
            b: "Parts",
            go: "setTab('parts')"
          };
        if (!w.measures.length && !w.plans.length)
          return {
            c: "",
            t: "No requirements on this WO yet. Add notes, parts or measures",
            b: "Notes",
            go: "setTab('notes')"
          };
        return { c: "ok", t: "Work order complete", b: null };
      }

      function wsHtml() {
        const w = wo(S.wo);
        if (!w) return `<div class="card empty">Select a work order.</div>`;
        const d = woD(w),
          n = nextFor(w, d),
          a = asset(w.assetId),
          rc = raisedOn(w.assetId).length;
        const tabState = {
          measure: d.bare.length
            ? "warn"
            : !d.pend.length && w.measures.length
              ? "done"
              : w.measures.some((m) => m.out)
                ? "prog"
                : "",
          execute:
            d.st.length && d.sd === d.st.length ? "done" : d.sd ? "prog" : "",
          parts: !w.parts.length
            ? ""
            : !d.short.length
              ? "done"
              : w.parts.some((p) => p.used)
                ? "prog"
                : "",
          notes: "",
          raised: ""
        };
        const tabs = [
          [
            "measure",
            "measure",
            "Measure",
            w.measures.length
              ? `${w.measures.length - d.pend.length}/${w.measures.length} recorded${d.finds.length ? ` · ${d.finds.length} finding` : ""}`
              : "None"
          ],
          [
            "execute",
            "execute",
            "Execute",
            w.plans.length
              ? `${w.plans.length} plans · ${d.sd}/${d.st.length} steps`
              : "No work plan"
          ],
          [
            "parts",
            "parts",
            "Parts",
            w.parts.length
              ? `${w.parts.length - d.short.length}/${w.parts.length} consumed`
              : "None required"
          ],
          [
            "notes",
            "notes",
            "Notes & codes",
            `${w.notes.length} note${w.notes.length === 1 ? "" : "s"}`
          ],
          ["raised", "raised", "Raised tasks", `${rc} on ${short(a.name)}`]
        ];
        const body = {
          measure: measureView,
          execute: executeView,
          parts: partsView,
          notes: notesView,
          raised: raisedView
        }[S.tab](w, d);
        return `
    <div class="card ws-h"><div class="top"><i class="dot s-${d.status}" style="width:16px;height:16px"></i><h1>${w.num} · ${esc(w.subject)}</h1>${w.raised ? '<span class="tag rt">RAISED TASK</span>' : ""}<span class="chip">⚙ ${short(a.name)}</span></div>
      <div class="kvs">${CFG.woTile.map((f) => `<div class="kv"><span class="k">${WO_FIELDS.find((x) => x[0] === f)[1]}</span><span class="v">${esc(fv(w, f, true))}</span></div>`).join("")}</div></div>
    <div class="card next ${n.c}"><div><div class="sec-t">Next step</div><div class="txt">${esc(n.t)}</div></div>${n.b ? `<button class="btn ${n.c === "ok" ? "btn-b" : "btn-p"}" onclick="${n.go}">${n.b} →</button>` : ""}</div>
    <div class="card tabs">${tabs
      .map(([k, icn, t, dd]) => {
        const st = tabState[k];
        return `<button class="tab ${S.tab === k ? "on" : ""} ${st}" onclick="setTab('${k}')"><span class="ic">${ic(icn)}</span><span><div class="t">${t}</div><div class="d">${dd}</div></span></button>`;
      })
      .join("")}</div>
    <div class="card panel">${body}</div>`;
      }

      /* ── Measure tab ── */
      function mCard(w, m) {
        const oc =
            {
              OK: "o-ok",
              Measure: "o-m",
              "Attention Required": "o-att",
              Scrap: "o-sc"
            }[m.out] || "",
          open = S.open === m.id,
          numeric = NUMERIC.includes(m.vt);
        const ob = (o, c, l) =>
          `<button class="out ${m.out === o ? "on " + c : ""}" onclick="setOut('${w.num}','${m.id}','${o}')">${l}</button>`;
        return `<div class="mrow ${oc} ${S.side === "doc" && S.docRow === m.id ? "hl" : ""}">
    <div><div class="c">${esc(m.comp)}</div>
      <div class="l"><button class="tag wt" onclick="showInDoc('${m.id}',${m.pg})" title="${esc(m.src)}">📄 ${esc(m.src.replace(/\.pdf$/, "").slice(0, 30))}… · p.${m.pg}</button>${m.loc ? `<span class="tag asset">📍 ${m.loc}</span>` : ""}</div>
      <div class="l">${m.at ? `<span class="when">🕒 Captured ${m.at}</span>` : "<i>Not recorded</i>"}${m.comments ? `<span>💬 ${esc(m.comments)}</span>` : ""}${m.review ? `<span>📝 ${esc(m.review)}</span>` : ""}</div></div>
    <div class="v">${m.val == null ? (numeric ? `<input class="vin" inputmode="decimal" placeholder="${unit(m.vt) || m.vt}" onchange="setVal('${w.num}','${m.id}',this.value)">` : "") : `${m.val}<small>${unit(m.vt)}</small>`}</div>
    <div class="outs">${ob("OK", "ok", "✓ OK")}${ob("Attention Required", "att", "⚠ Attention")}${ob("Scrap", "sc", "✕ Scrap")}
      <button class="out" onclick="toast('Camera / attach image to measure')">📷</button>
      <button class="out r ${open ? "sel" : ""}" onclick="S.open=S.open==='${m.id}'?null:'${m.id}';render()">${ic("edit")} Edit</button></div>
    ${
      open
        ? `<div class="mdet">
      ${isF(m) && !m.comments.trim() ? `<div class="warnline">⚠ Describe the finding. Attention Required + comment also triggers the notification Case flow.</div>` : ""}
      <div class="f full"><label>Comments</label><textarea rows="2" id="mc_${m.id}">${esc(m.comments)}</textarea></div>
      <div class="f full"><label>Review notes</label><textarea rows="2" id="mr_${m.id}">${esc(m.review)}</textarea></div>
      <div class="f"><label>Defect location</label><select id="ml_${m.id}"><option value="">—</option>${DEFECT_LOC.map((x) => `<option ${m.loc === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
      <div class="f"><label>Page # <span class="fut">future field</span></label><input disabled value="${m.pg}"></div>
      <div class="f full"><label>Source document <span class="fut">future field</span></label><div class="ro">📄 ${esc(m.src)}</div></div>
      <div class="full" style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-g btn-sm" onclick="S.open=null;render()">Cancel</button><button class="btn btn-b btn-sm" onclick="saveMeta('${w.num}','${m.id}')">Save</button></div>
    </div>`
        : ""
    }
  </div>`;
      }
      function trendCell(w, m) {
        const h = hist(w, m),
          numeric = NUMERIC.includes(m.vt);
        if (!numeric) {
          const pts = [
            ...h,
            { dt: "2026-08-18", n: w.num, out: m.out, cur: true }
          ];
          const col = (o) =>
            ({
              OK: "#21C07A",
              "Attention Required": "#F2B441",
              Scrap: "#E84B4B",
              Measure: "#2E8FE6"
            })[o] || "#243040";
          return `<div class="tcell"><div class="th"><b>Outcome history · ${esc(m.comp)}</b><span>${short(asset(w.assetId).name)}</span></div>
      <div class="otl">${pts.map((p) => `<div class="o ${p.cur ? "cur" : ""}"><i style="background:${col(p.out)};${p.cur && !p.out ? "border:2px dashed #6B7A89" : ""}"></i>${p.dt.slice(5)}<span>${p.cur ? "this WO" : p.n}</span></div>`).join("")}</div></div>`;
        }
        const pts = [
          ...h,
          ...(m.val != null
            ? [{ dt: "2026-08-18", n: w.num, v: m.val, cur: true }]
            : [])
        ];
        const W = 320,
          H = 110,
          L = 34,
          R = 26,
          T = 10,
          B = 30,
          vals = pts.map((p) => p.v),
          mn = Math.min(...vals),
          mx = Math.max(...vals),
          pad = (mx - mn || mx * 0.1 || 1) * 0.25;
        const lo = mn - pad,
          hi = mx + pad,
          n = pts.length + (m.val == null ? 1 : 0);
        const sx = (i) => L + (i * (W - L - R)) / Math.max(1, n - 1),
          sy = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
        const last = pts[pts.length - 1],
          prev = pts[pts.length - 2],
          delta = last && prev ? last.v - prev.v : 0;
        return `<div class="tcell"><div class="th"><b>${esc(m.comp)} · ${unit(m.vt) || m.vt}</b><span>${m.val != null && prev ? `${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta).toFixed(1)} vs ${prev.n}` : "awaiting this WO’s reading"}</span></div>
    <svg viewBox="0 0 ${W} ${H}">

      /* ── Execute / Parts / Notes / Raised ── */

          ? `<div class="parts-table"><div class="parts-head"><span class="parts-col-name">Part</span><span class="parts-col-num">Consumed</span><span class="parts-col-num">Required</span><span class="parts-col-num">Cost</span><span class="parts-col-act"></span></div>

    ${S.addPart ? `<div class="ar-addpart-row"><select id="newPart"><option value="">Select a part…</option><option>Hydraulic oil 20L</option><option>Filter</option><option>Rag pack</option><option>Seal kit — HP</option></select><button class="ar-consume-btn" onclick="addPart('${w.num}')">Add</button></div>` : ""}</div>`

      /* ───────────── actions ───────────── */
      function pick(id) {
        expandWol();
        S.sel = id;
        S.focus = kids(id).length ? id : asset(id).parent || id;
        const ids = S.inclSub ? desc(id) : [id],
          cur = wo(S.wo);
        if (!asset(id).parent) S.wo = D.wos[0].num;
        else if (!ids.includes(cur.assetId)) {
          const f = D.wos.find((w) => !w.isWp && ids.includes(w.assetId));
          S.wo = f ? f.num : D.wos[0].num;
        }
        S.hl = wo(S.wo).assetId;
        S.open = null;
        S.docRow = null;
        render();
      }
      function zoom(id) {
        expandWol();
        S.focus = id;
        S.sel = id;
        render();
      }
      function selWoAR(num) {
        S.wo = num;
        S.open = null;
        S.docRow = null;
        const w = wo(num),
          d = woD(w);
        S.hl = w.assetId;
        if (!desc(S.focus).includes(w.assetId)) S.focus = D.assets[0].id;
        S.tab =
          d.pend.length ||
          d.bare.length ||
          (!w.plans.length && w.measures.length)
            ? "measure"
            : w.plans.length
              ? "execute"
              : "notes";
        render();
      }
      function setTab(t) {
        S.tab = t;
        if (wantsRoom()) collapseWol(true);
        render();
      }
      function setSide(v) {
        S.side = v;
        if (wantsRoom()) collapseWol(true);
        render();
      }
      function showInDoc(mid, pg) {
        S.side = "doc";
        S.pg = pg;
        S.docRow = mid;
        collapseWol(true);
        render();
      }
      const nowStamp = () =>
        new Date().toLocaleString("en-AU", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      function setOut(num, mid, o) {
        autoClock();
        const m = wo(num).measures.find((x) => x.id === mid);
        m.out = o;
        m.at = nowStamp();
        if (isF(m) && !m.comments.trim()) S.open = mid;
        render();
      }
      function setVal(num, mid, v) {
        autoClock();
        const m = wo(num).measures.find((x) => x.id === mid);
        m.val = v === "" ? null : Number(v);
        m.at = nowStamp();
        if (!m.out) m.out = "Measure";
        render();
      }
      function saveMeta(num, mid) {
        autoClock();
        const m = wo(num).measures.find((x) => x.id === mid);
        m.comments = document.getElementById("mc_" + mid).value;
        m.review = document.getElementById("mr_" + mid).value;
        m.loc = document.getElementById("ml_" + mid).value;
        S.open = null;
        render();
        toast(
          m.out === "Attention Required" && m.comments
            ? "Saved. Notification Case flow fires on Attention + comment"
            : "Measure updated"
        );
      }
      function stepClick(num, pi, i) {
        autoClock();
        const w = wo(num),
          s = w.plans[pi].steps[i];
        if (s.flow)
          toast(
            "In Progress, then launches flow " +
              s.flow +
              ". Completed on finish, New if cancelled"
          );
        s.d = true;
        const st = w.plans.filter((p) => !p.exception).flatMap((p) => p.steps);
        w.status = st.every((x) => x.d) ? "Completed" : "In Progress";
        render();
      }
      function consume(num, i) {
        autoClock();

        toast(`${q} × ${n} consumed`);

      function addNote(num) {

        render();
        toast("Note saved");

      /* rollups (same KPI rules as getWorkpackProgress) */
      function kpis() {
        const all = D.wos,

          x = XTRA[D.key];

          measures: [ms.filter((m) => m.out).length, ms.length],

              .length,
            ch.length

        const on = CFG.wpRings.filter((r) => k[r][1] > 0);
        k.overall = on.length
          ? Math.round(
              (on.reduce((a, r) => a + k[r][0] / k[r][1], 0) / on.length) * 100

      const fmtK = (v, u) =>

    <text x="${c}" y="${c}" fill="#F2F5F7" font-size="${size > 70 ? 17 : 14}" font-weight="700" text-anchor="middle" dominant-baseline="central">${Math.round(p * 100)}%</text></svg>`;

      const ST = [

      function wpNext() {

      }
      function openAR(num) {
        location.href =
          "asset-review-redesign-v6.html#ds=" + D.key + "&wo=" + num;
      }
      function selWo(num) {
        openAR(num);
      }

      function render() {
        if (NAV === "workorders") return renderWP();
        renderSidebar();
        renderClock();
        if (NAV === "config")
          return put(document.getElementById("page"), configPage());
        renderAR();
      }
      function renderWP() {
        renderSidebar();
        renderClock();
        const root = D.wos[0],
          a = asset(root.assetId),
          x = XTRA[D.key],
          k = kpis(),
          ch = children();
        const rec = Object.assign({}, root, {
          SAP_Work_Center__c: x.SAP_Work_Center__c,
          Basic_Finish_Date__c: x.Basic_Finish_Date__c
        });
        const n = wpNext(),
          done = ch.filter((w) => woD(w).status === "green").length;
        const tabs = [
          [
            "notes",
            "notes",
            "Notes & codes",
            `${root.notes.length} note${root.notes.length === 1 ? "" : "s"}`,
            true
          ],
          [
            "execute",
            "execute",
            "Execute",
            (() => {
              const d = woD(root);
              return root.plans.length
                ? `${d.sd}/${d.st.length} workpack steps`
                : "No work plan";
            })(),
            true
          ],
          [
            "children",
            "wos",
            "Work orders",
            `${done}/${ch.length} done · ${ch.filter((w) => woD(w).status === "red").length} with findings`,
            true
          ],
          ["ops", "ops", "Operations", `${x.ops.length} line items`, CFG.wpOps],
          [
            "time",
            "time",
            "Time records",
            `${(x.time.reduce((s, t) => s + t[3], 0) / 60).toFixed(1)}h logged`,
            CFG.wpTime
          ],
          [
            "raised",
            "raised",
            "Raised tasks",
            `${raisedOn(root.assetId).length} on ${short(a.name)}`,
            CFG.wpRaised
          ]
        ].filter((t) => t[4]);
        if (!tabs.find((t) => t[0] === W.tab)) W.tab = tabs[0][0];
        const body = {
          children: childrenView,
          execute: () =>
            `<button class="btn btn-p btn-xl" onclick="openAR('${ch[0] ? ch[0].num : root.num}')">${ic("ar")} Open Asset Review<span class="sub2">Measure, execute and add parts on the child work orders</span></button>` +
            executeView(root),
          ops: opsView,
          notes: () => notesView(root),
          time: timeView,
          raised: () => raisedView(root)
        }[W.tab]();
        put(
          document.getElementById("page"),
          `
    <div class="topbar"><button class="back">‹ Work Orders</button><span class="tb-title">${D.title}</span><span class="chip">Workpack ${D.wp}</span><span class="pill ${root.status === "In Progress" ? "ip" : ""}">${root.status}</span>
      <div class="tb-right"><div class="ds"><button class="${D.key === "HT" ? "on" : ""}" onclick="loadDs('HT')">HT-02 · 00012423</button><button class="${D.key === "WG" ? "on" : ""}" onclick="loadDs('WG')">WG 20213 · 00010070</button></div>
        <span>${k.overall}% overall</span><div class="bar"><i style="width:${k.overall}%"></i></div>
        <button class="dashed" onclick="openNotes()">ⓘ Design notes</button></div></div>
    <div class="wrap">
      <div class="card wph"><div class="top"><i class="dot s-${assetStatus(a.id)}" style="width:16px;height:16px"></i><h1>${esc(root.subject)}</h1>
          <span class="chip">⚙ ${esc(short(a.name))}</span>
          <button class="btn btn-p btn-big" onclick="openAR('${ch[0] ? ch[0].num : root.num}')">${ic("ar")} Open Asset Review</button></div>
        <div class="kvs">${CFG.wpTile.map((f) => `<div class="kv"><span class="k">${WO_FIELDS.find((z) => z[0] === f)[1]}</span><span class="v">${esc(fv(rec, f, true))}</span></div>`).join("")}</div>
        <div><span class="desc ${W.descOpen ? "" : "clip"}">${esc(x.desc)}</span> <button class="linkb" onclick="W.descOpen=!W.descOpen;render()">${W.descOpen ? "Less" : "More"}</button></div></div>
      ${CFG.wpNext ? `<div class="card next ${n.c}"><div><div class="sec-t">Next step</div><div class="txt">${esc(n.t)}</div></div>${n.b ? `<button class="btn ${n.c === "ok" ? "btn-b" : "btn-p"}" onclick="${n.go}">${n.b} →</button>` : ""}</div>` : ""}
      ${progHtml()}
      <div class="card tabs" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(([key, icn, t, dd]) => `<button class="tab ${W.tab === key ? "on" : ""}" onclick="W.tab='${key}';render()"><span class="ic">${ic(icn)}</span><span><div class="t">${t}</div><div class="d">${dd}</div></span></button>`).join("")}</div>
      <div class="card panel">${body}</div>
    </div>`
        );
      }

      /* config: categories (left) → sub-sections (one at a time, right) */
      let CC = "ar_asset";
      const CFG_CATS = [
        [
          "Asset Review",
          [
            ["ar_asset", "Asset title tile"],
            ["ar_drawer", "Asset details drawer"],
            ["ar_wo", "Work order title tile"]
          ]
        ],
        [
          "Workpack page",
          [
            ["wp_tile", "Header tile"],
            ["wp_next", "Next step"],
            ["wp_prog", "Progress panel"],
            ["wp_tabs", "Tabs"],
            ["wp_child", "Work orders tab"]
          ]
        ],
        ["Shared", [["sh_wtf", "Work type focus filter"]]]
      ];
      function cfgList(key, cat) {
        return cat
          .map(([f, l]) => {
            const on = CFG[key].includes(f),
              i = CFG[key].indexOf(f);
            return `<div class="cfg-row"><button class="cb ${on ? "on" : ""}" onclick="cfgTog('${key}','${f}')">${on ? "✓" : ""}</button><span>${l}<code>${f}</code></span>
      <span>${on ? `<button class="mv" onclick="cfgMove('${key}','${f}',-1)">▲</button><button class="mv" onclick="cfgMove('${key}','${f}',1)">▼</button><span class="mv">#${i + 1}</span>` : ""}</span></div>`;
          })
          .join("");
      }
      const cfgChk = (key, l, code) =>
        `<div class="cfg-row"><button class="cb ${CFG[key] ? "on" : ""}" onclick="CFG.${key}=!CFG.${key};render()">${CFG[key] ? "✓" : ""}</button><span>${l}<code>${code}</code></span><span></span></div>`;
      const cfgSeg = (key, v, l) =>
        `<button class="${CFG[key] === v ? "on" : ""}" onclick="CFG.${key}='${v}';W.prog=null;W.view=CFG.wpView;render()">${l}</button>`;
      const kvPrev = (rec, flds, cat, isWo) =>
        `<div class="kvs" style="margin-top:8px">${flds.map((f) => `<div class="kv"><span class="k">${cat.find((x) => x[0] === f)[1]}</span><span class="v">${esc(fv(rec, f, isWo))}</span></div>`).join("")}</div>`;
      function cfgBody() {
        const a = D.assets[0],
          w = D.wos[0],
          x = XTRA[D.key],
          rec = Object.assign({}, w, {
            SAP_Work_Center__c: x.SAP_Work_Center__c,
            Basic_Finish_Date__c: x.Basic_Finish_Date__c
          });
        const prev = (h) =>
          `<div class="card cfg-sec"><h4>Preview</h4><div class="preview">${h}</div></div>`;
        switch (CC) {
          case "ar_asset":
            return [
              `<div class="card cfg-sec"><h4>Fields</h4><div class="sub">Shown next to the selected asset name on Asset Review. ▲▼ = order.</div>${cfgList(
                "assetTile",
                ASSET_FIELDS.filter((z) => z[0] !== "Name")
              )}</div>`,
              prev(
                `<div class="sec-t">Selected asset</div><b>${esc(a.name)}</b>${kvPrev(a, CFG.assetTile, ASSET_FIELDS)}`
              )
            ];
          case "ar_drawer":
            return [
              `<div class="card cfg-sec"><h4>Fields</h4><div class="sub">Shown in ⓘ Asset details. Read = view only, Edit = kiosk can change it.</div>
        ${ASSET_FIELDS.map(([f, l]) => {
          const m = CFG.assetDrawer[f] || "";
          return `<div class="cfg-row"><button class="cb ${m ? "on" : ""}" onclick="cfgDrawer('${f}','${m ? "" : "R"}')">${m ? "✓" : ""}</button><span>${l}<code>${f}</code></span>
            <span>${m ? `<span class="mini"><button class="${m === "R" ? "on" : ""}" onclick="cfgDrawer('${f}','R')">Read</button><button class="${m === "E" ? "on" : ""}" onclick="cfgDrawer('${f}','E')">Edit</button></span>` : ""}</span></div>`;
        }).join("")}</div>`
            ];
          case "ar_wo":
            return [
              `<div class="card cfg-sec"><h4>Fields</h4><div class="sub">Shown under the WO number in the Asset Review workspace.</div>${cfgList(
                "woTile",
                WO_FIELDS.filter((z) => z[0] !== "WorkOrderNumber")
              )}</div>`,
              prev(
                `<b>${w.num} · ${esc(w.subject)}</b>${kvPrev(w, CFG.woTile, WO_FIELDS, true)}`
              )
            ];
          case "wp_tile":
            return [
              `<div class="card cfg-sec"><h4>Fields</h4><div class="sub">Shown under the workpack name.</div>${cfgList(
                "wpTile",
                WO_FIELDS.filter((z) => z[0] !== "WorkOrderNumber")
              )}</div>`,
              prev(
                `<b>${esc(w.subject)}</b>${kvPrev(rec, CFG.wpTile, WO_FIELDS, true)}`
              )
            ];
          case "wp_next":
            return [
              `<div class="card cfg-sec"><h4>Next step band</h4><div class="sub">Tells the worker what to do next on the whole workpack. Button = Open Asset Review while child work orders have open items.</div>
        ${cfgChk("wpNext", "Show next step", "Feature setting · WP_Next_Step")}</div>`
            ];
          case "wp_prog":
            return [
              `<div class="card cfg-sec"><h4>Default state</h4><div class="sub">Workers can still Show / Hide it on the page.</div>
          <div class="cfg-row"><span></span><span>Progress panel</span><span class="mini">${cfgSeg("wpProgress", "open", "Open")}${cfgSeg("wpProgress", "collapsed", "Summary line")}${cfgSeg("wpProgress", "off", "Hidden")}</span></div></div>`,
              `<div class="card cfg-sec"><h4>Rings</h4><div class="sub">Overall % is the mean of the rings shown that have data.</div>
          ${RINGS.map(([key, l]) => {
            const on = CFG.wpRings.includes(key);
            return `<div class="cfg-row"><button class="cb ${on ? "on" : ""}" onclick="cfgTog('wpRings','${key}')">${on ? "✓" : ""}</button><span>${l}<code>WorkpackProgressDTO.${key}</code></span><span></span></div>`;
          }).join("")}</div>`
            ];
          case "wp_tabs":
            return [
              `<div class="card cfg-sec"><h4>Optional tabs</h4><div class="sub">Order: Notes &amp; codes · Execute · Work orders · Operations · Time records · Raised tasks. The first three are always on.</div>
        ${cfgChk("wpOps", "Operations", "WorkOrderLineItem")}${cfgChk("wpTime", "Time records (existing time on this workpack)", "Time_Report__c")}${cfgChk("wpRaised", "Raised tasks", "WorkOrder.Raised_Task__c")}</div>`
            ];
          case "wp_child":
            return [
              `<div class="card cfg-sec"><h4>Work orders tab</h4><div class="sub">Child work order progress list.</div>
        <div class="cfg-row"><span></span><span>Default view</span><span class="mini">${cfgSeg("wpView", "list", "List")}${cfgSeg("wpView", "board", "Board")}</span></div>
        ${cfgChk("wtFilter", "Show work type focus chips in this tab", "Shared setting · Work_Type_Filter")}</div>`
            ];
          case "sh_wtf":
            return [
              `<div class="card cfg-sec"><h4>${ic("filter")} Work type focus filter</h4><div class="sub">Multi-select chips built from the WorkTypes of WOs under the workpack. Shown above the asset map on Asset Review and inside the Work orders tab on the workpack page.</div>
        ${cfgChk("wtFilter", "Enable work type filter", "Feature setting · Work_Type_Filter")}</div>`
            ];
        }
      }
      function configPage() {
        const cur = CFG_CATS.flatMap((c) => c[1].map((x) => [c[0], ...x])).find(
          (x) => x[1] === CC
        );
        return `<div class="cfg-wrap"><h1>🛠 Kiosk Config</h1>
    <div class="sub">Org-wide: applies to every kiosk. Supervisor/admin only. Store: custom object <code style="color:var(--warn)">Kiosk_App_Config__c</code>. Planned, not built.</div>
    <div class="cfg2"><nav class="card cfg-nav">${CFG_CATS.map(([cat, subs]) => `<div class="cn-h">${cat}</div>${subs.map(([k, l]) => `<button class="cn ${CC === k ? "on" : ""}" onclick="CC='${k}';render()">${l}</button>`).join("")}`).join("")}</nav>
      <div class="cfg-main"><div class="cfg-crumb">${cur[0]} › <b>${cur[2]}</b></div>${cfgBody().join("")}</div></div></div>`;
      }

      function openNotes() {
        put(
          document.getElementById("dn"),
          `<h3>Design notes · Workpack v1.1 <button onclick="closeAll()">✕</button></h3>
  <h4>v1.1 changes</h4><ul>
    <li>Work type focus chips moved inside the <b>Work orders</b> tab (they only filter that list).</li>
    <li>Next step button = <b>Open Asset Review</b> whenever a child (or the workpack) has open items. Next step band can be hidden in Kiosk Config.</li>
    <li>Tab order: Notes &amp; codes · Execute · Work orders · Operations · Time records · Raised tasks. Page opens on the first tab.</li>
    <li>Execute tab opens with a large <b>Open Asset Review</b> button, above the work plans.</li>
    <li>Kiosk Config split into categories (Asset Review · Workpack page · Shared), one sub-section at a time.</li></ul>
  <h4>What changed vs. today's workpack page</h4><ul>
    <li><b>No Time Tracking panel.</b> Clock in/out lives in the header (all pages, auto-clock on any data change). Existing time on this workpack moves to an optional <b>Time records</b> tab (read-only <code>Time_Report__c</code>, live row when you're clocked in here).</li>
    <li><b>Same tab bar as Asset Review</b>: Child work orders · Execute (the workpack's own Work Plans, e.g. release-to-traffic) · Operations · Notes &amp; codes · Time records · Raised tasks. Operations, Time records and Raised tasks can be switched off in Kiosk Config.</li>
    <li><b>Progress panel</b>: same 6 KPIs + Overall as <code>getWorkpackProgress</code>. Config default = Open, Summary line, or Hidden; pick which rings show. Workers can Hide ▴ / Show ▾. Collapsed = one line of n/m chips.</li>
    <li><b>Header</b>: workpack name, configurable fields (Kiosk Config → Workpack title tile), description clipped to 2 lines, big <b>Open Asset Review</b>.</li>
    <li><b>Next step</b> for the whole pack: first finding without a comment, then the first child still to measure, then any open child, then "run release checks".</li>
    <li>Operations / Work Plans sidebar is gone: Operations = tab, Work Plans = Execute tab.</li></ul>
  <h4>Child work order progress</h4><ul>
    <li><b>Status bar</b> across all children (Complete / Has finding / In progress / Not started). Tap a colour or legend chip to filter.</li>
    <li><b>List</b> (default): one row per child, sorted needs-attention first. Columns: Steps bar, Measures bar (green OK + red findings), Parts bar, next step. Group by Work type, System (L2 asset) or Status, each group with its own status bar.</li>
    <li><b>Board</b>: 4 columns by status, cards with the same three mini bars.</li>
    <li>Work type focus chips (if enabled) filter this list, same as Asset Review.</li>
    <li>Tap a row: opens Asset Review on that WO (map highlight + its asset).</li>
    <li><b>Labour per child is not shown</b>: the clock books time to the workpack, not to child WOs. Shown only as estimate and in the workpack Labour ring.</li></ul>
  <h4>Build impact (planning)</h4><ul>
    <li>New Apex: per-child rollup (steps, measures taken/findings, parts used/required) grouped by <code>WorkOrderId</code> over the workpack span. Same queries as <code>getWorkpackProgress</code>, plus GROUP BY. WorkPlan/WorkStep read in SYSTEM_MODE (Private OWD, as today).</li>
    <li>Status colour rules reuse the Asset Review rules.</li>
    <li>New <code>Kiosk_App_Config__c</code> settings: wpNext, wpProgress, wpRings, wpOps, wpTime, wpRaised, wpView, wpTile.</li>
    <li>Verified 2026-11-11: RootWorkOrderId is set on every child of 00012423 and 00010070, including grandchildren (00012649 → parent 00012431 → root 00012423). Today's ParentWorkOrderId queries miss grandchildren, so the rollup must use RootWorkOrderId.</li>
    <li>Description, Work Center, Basic Finish, operations, time records and labour hours are sample data.</li></ul>`
        );
        openL("dn");
      }

      loadDs((location.hash.match(/ds=(\w+)/) || [])[1] || "HT");
    </script>
  </body>
</html>
Same tab bar as Asset Review: Notes &amp; codes · Execute (the workpack's own
Work Plans, e.g. release-to-traffic) · Work orders · Operations · Time records ·
Raised tasks. Operations, Time records and Raised tasks can be switched off in
Kiosk Config.
